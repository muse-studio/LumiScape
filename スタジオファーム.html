<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>照明シミュレーター</title>
  <style>
    body {
     margin: 0;
     display: flex;
     flex-direction: column;
     height: 100vh;
     overflow: hidden;
    }
    #mainArea {
     flex: 1;
     display: flex;
    }
    #scene {
     flex: 1;
     overflow: hidden;
     position: relative;
    }
    #ui {
     width: 300px;
     background: #eee;
     padding: 10px;
    }
    #timeline {
     height: 300px;
     background: #222;
     color: white;
     border-top: 2px solid #444;
     padding: 10px;
     display: flex;
     flex-direction: column;
     box-sizing: border-box;
    }
    #timelineControls button {
     width: 40px;
     height: 30px;
     font-size: 16px;
    }
    #timelineControls #loopButton {
     width: auto;
     width: 95px;
     height: 30px;
     padding: 0 10px;
     font-size: 14px;
     background: #f0f0f0;
     color: black;
     border: 1px solid #888;
     border-radius: 2px;
     cursor: pointer;
    }
    #timelineControls #loopButton.loopOn {
     background: yellow;
     color: black;
    }
    #timelineRuler {
     position: relative;
     height: 30px;
     background: #333;
     border-bottom: 1px solid #555;
     overflow-x: auto;
     overflow-y: hidden;
     white-space: nowrap;
     -webkit-overflow-scrolling: touch;
    }
    .timeMark {
     position: absolute;
     top: 5px;
     color: white;
     font-size: 12px;
    }
    #playhead {
     position: absolute;
     top: 0;
     left: 200px;
     width: 2px;
     height: 100%;
     background: red;
     z-index: 999;
     pointer-events: none;
    }
    #keyframeArea {
     position: relative;
     height: 240px;
     background: #1e1e1e;
     overflow-x: auto;
     overflow-y: auto;
     border-top: 1px solid #555;
     -webkit-overflow-scrolling: touch;
    }
    #trackLabels {
     position: absolute;
     left: 0;
     top: 0;
     width: 150px;
     height: 100%;
     background: #2a2a2a;
     z-index: 1000;
     border-right: 1px solid #555;
     pointer-events: none;
    }
    #rulerHeader {
     position: absolute;
     left: 0;
     top: 0;
     width: 150px;
     height: 100%;
     background: #2a2a2a;
     z-index: 1000;
     border-right: 1px solid #555;
    }
    .trackLabel {
     height: 80px;
     line-height: 80px;
     padding-left: 12px;
     color: white;
     border-bottom: 1px solid #444;
     box-sizing: border-box;
     font-size: 14px;
     background: #2a2a2a;
     width: 150px;
    }
    #playheadLine {
     position: absolute;
     top: 0;
     left: 200px;
     width: 2px;
     height: 100%;
     background: red;
     z-index: 999;
     pointer-events: none;
    }
    #timelineRuler::-webkit-scrollbar,
    #keyframeArea::-webkit-scrollbar {
     display: none;
    }
    .waveformCanvas {
     position: absolute;
     left: 0;
     top: 8px;
     height: 55px;
     z-index: 1;
     pointer-events: none;
     opacity: 0.85;
    }
    .keyframe {
     position: absolute;
     width: 12px;
     height: 12px;
     background: orange;
     border-radius: 50%;
     top: 20px;
     transform: translateX(-50%);
     cursor: pointer;
     z-index: 5;
    }
    .selectedKeyframe {
     outline: 2px solid yellow;
    }
    #backButton {
     width: 28px;
     height: 28px;
     font-size: 14px;
     padding: 0;
     margin-bottom: 4px;
     cursor: pointer;
    }
    #keyframeInner {
     position: relative;
     width: 3000px;
     height: 100%;
     margin-left: 150px;
    }
    #modeButtons {
     position: absolute;
     bottom: 20px;
     left: 20px;
     display: flex;
     gap: 10px;
     z-index: 1000;
    }
    #modeButtons button {
     width: 60px;
     height: 60px;
     font-size: 24px;
     border: none;
     border-radius: 12px;
     background: rgba(50,50,50,0.8);
     color: white;
     cursor: pointer;
    }
    #modeButtons button.active {
     background: orange;
    }
    .lightButton{
     width:100%;
     height:120px;
     display:flex;
     flex-direction:column;
     align-items:center;
     justify-content:center;
     gap:8px;
     margin-bottom:10px;
     cursor:pointer;
    }
    .lightPanel {
     width: 100%;
     min-height: 170px;
     border: 1px solid #888;
     margin-bottom: 10px;
     padding: 10px;
     box-sizing: border-box;
     text-align: center;
    }
    .lightTitle {
     font-size: 18px;
     margin-bottom: 10px;
    }
    .mountButtons {
     display: flex;
     gap: 8px;
     justify-content: center;
     margin-bottom: 10px;
    }
    .mountButtons button {
     width: 70px;
     height: 32px;
     font-size: 15px;
     cursor: pointer;
    }
    .lightButton img{
     width:70px;
     height:70px;
     object-fit:contain;
    }
    .movingControlRow {
     display: flex;
     gap: 18px;
    }
    .movingControlBox {
     flex: 1;
    }
    .directionButtonSpace {
     height: 34px;
     margin-bottom: 16px;
    }
    .movingControlBox input[type="range"] {
     width: 100%;
    }
    .angleInputBox{
     display:flex;
     align-items:center;
     gap:4px;
     margin-top:8px;
    }
    .angleInput {
     width: 45px;
     height: 24px;
     font-size: 16px;
     margin-top: 8px;
    }
    .angleInputBox span{
     font-size:20px;
     font-weight:bold;
    }
    .wallButtonWrap {
     position: relative;
    }
    .wallMenu {
     display: none;
     position: absolute;
     top: 40px;
     left: -45px;
     background: white;
     border: 1px solid #888;
     padding: 8px;
     z-index: 2000;
     box-shadow: 0 2px 6px rgba(0,0,0,0.25);
     white-space: nowrap;
    }
    .wallMenu::before {
     content: "";
     position: absolute;
     top: -8px;
     left: 55px;
     border-left: 8px solid transparent;
     border-right: 8px solid transparent;
     border-bottom: 8px solid white;
    }
    .wallMenu button {
     width: 45px;
     height: 30px;
     margin: 2px;
    }
    .menuButton {
     width: 100%;
     height: 70px;
     margin-bottom: 12px;
     font-size: 22px;
     cursor: pointer;
    }
    .menuBackButton {
     width: 40px;
     height: 34px;
     margin-bottom: 8px;
     font-size: 18px;
     cursor: pointer;
    }
    #roomSettingUI label {
     display: inline-block;
     width: 45px;
     margin-bottom: 10px;
    }
    .lightingModeRow {
     display: flex;
     align-items: center;
     gap: 10px;
     margin: 12px 0;
    }
    .switch {
     position: relative;
     display: inline-block;
     width: 52px;
     height: 28px;
    }
    .switch input {
     opacity: 0;
     width: 0;
     height: 0;
    }
    .switchSlider {
     position: absolute;
     cursor: pointer;
     inset: 0;
     background: #aaa;
     border-radius: 28px;
     transition: 0.25s;
    }
    .switchSlider::before {
     content: "";
     position: absolute;
     width: 22px;
     height: 22px;
     left: 3px;
     top: 3px;
     background: white;
     border-radius: 50%;
     transition: 0.25s;
    }
    .switch input:checked + .switchSlider {
     background: #35d05b;
    }
    .switch input:checked + .switchSlider::before {
     transform: translateX(24px);
    }
  </style>
</head>
<body>
<div id="mainArea">
  <!-- 3D画面 -->
  <div id="scene">
    <div id="modeButtons">
      <button id="cameraModeButton">📷</button>
      <button id="handModeButton">✋</button>
      <button id="objectModeButton">💡</button>
    </div>
  </div>
  <!-- 右側UI -->
  <div id="ui">
    <!-- 通常UI -->
    <div id="defaultUI">
      <!-- 最初のメニュー -->
      <div id="mainMenuUI">
        <h3>操作パネル</h3>
        <button onclick="toggleLight()">
          部屋照明 ON/OFF
        </button>
        <hr>
        <button
          class="menuButton"
          onclick="showRoomUI()"
        >部屋</button>
        <button
          class="menuButton"
          onclick="showLightUI()"
        >ライト</button>
        <button
          class="menuButton"
          onclick="showPlateUI()"
        >プレート</button>
      </div>
      <!-- 部屋設定ページ -->
      <div id="roomSettingUI" style="display:none;">
        <button
          class="menuBackButton"
          onclick="showMainMenuUI()"
        >←</button>
        <h3>部屋設定</h3>
        <h4>部屋サイズ</h4>
        <label>横</label>
        <input
          type="number"
          id="roomWidthInput"
          value="11"
          style="width:60px;"
        >m<br>
        <label>縦</label>
        <input
          type="number"
          id="roomDepthInput"
          value="18"
          style="width:60px;"
        >m<br>
        <label>高さ</label>
        <input
          type="number"
          id="roomHeightInput"
          value="4.2"
          style="width:60px;"
        >m<br><br>
        <button onclick="updateRoomSize()">
          部屋サイズ変更
        </button>
      </div>
      <!-- ライト選択ページ -->
      <div id="lightSelectionUI" style="display:none;">
        <button
          class="menuBackButton"
          onclick="showMainMenuUI()"
        >←</button>
        <div class="lightingModeRow">
          <span>照明効果</span>
          <label class="switch">
            <input
             type="checkbox"
             id="realLightingSwitch"
             onchange="toggleRealLighting(this.checked)"
            >
            <span class="switchSlider"></span>
          </label>
        </div>
        <h3>ライト選択</h3>
        <div class="lightPanel">
          <div class="lightTitle">
            ムービングライト
          </div>
          <div class="mountButtons">
            <button onclick="addMovingLight('floor')">床</button>
            <div class="wallButtonWrap">
              <button onclick="toggleWallMenu()">壁</button>
              <div id="wallMenu" class="wallMenu">
                <button
                  onclick="addMovingLight('wall','front')"
                >前</button>
                <button
                  onclick="addMovingLight('wall','left')"
                >左</button>
                <button
                  onclick="addMovingLight('wall','back')"
                >後</button>
                <button
                  onclick="addMovingLight('wall','right')"
                >右</button>
              </div>
            </div>
            <button onclick="addMovingLight('ceiling')">天井</button>
          </div>
        </div>
        <button
          class="lightButton"
          onclick="addTapeLight()"
        >
          <div>テープライト</div>
          <img
            src="テープライト.png"
            alt="テープライト"
          >
        </button>
        <button class="lightButton" onclick="addSmartBulb()">
          <div>スマートライト</div>
        </button>
      </div>
      <!-- プレート設定ページ -->
      <div id="plateSettingUI" style="display:none;">
       <!-- 上部 -->
       <div class="plateHeader">
         <button
           class="menuBackButton"
           onclick="closePlateUI()"
          >←</button>
          <div class="plateHeaderTitle">プレート設定</div>
          <button
           id="platePowerButton"
           class="platePowerButton active"
           onclick="togglePlatePowerUI()"
          >ON</button>
        </div>
        <!-- 選択状態 -->
        <div class="plateStatus">
         <span id="currentWallText">前壁</span>
         <span id="plateDivisionText">縦4マス×横8マス</span>
         <span id="selectedPlateCount">選択中：0マス/32マス</span>
        </div>
        <!-- 壁面選択 -->
        <div class="plateSection">
         <div class="plateSectionTitle">壁面選択</div>
         <div class="plateWallButtons">
           <button
             class="plateWallButton active"
             data-wall="front"
             onclick="selectPlateWallUI(this, '前壁')"
            >前壁</button>
            <button
             class="plateWallButton"
             data-wall="back"
             onclick="selectPlateWallUI(this, '後壁')"
            >後壁</button>
            <button
             class="plateWallButton"
             data-wall="left"
             onclick="selectPlateWallUI(this, '左壁')"
            >左壁</button>
            <button
             class="plateWallButton"
             data-wall="right"
             onclick="selectPlateWallUI(this, '右壁')"
            >右壁</button>
          </div>
        </div>
        <!-- マス数設定 -->
        <div class="plateSection">
         <div class="plateSectionTitle">マス(分割)数設定</div>
         <!-- 横 -->
         <div class="plateNumberRow">
           <span class="plateNumberLabel">横（列）数</span>
           <button
             class="plateSmallButton"
             onclick="changePlateColumnsUI(-1)"
            >−</button>
           <span id="plateColumnValue" class="plateNumberValue">8</span>
           <button
             class="plateSmallButton"
             onclick="changePlateColumnsUI(1)"
            >＋</button>
          </div>
          <!-- 縦 -->
          <div class="plateNumberRow">
           <span class="plateNumberLabel">縦（行）数</span>
           <button
             class="plateSmallButton"
             onclick="changePlateRowsUI(-1)"
            >−</button>
            <span id="plateRowValue" class="plateNumberValue">4</span>
           <button
             class="plateSmallButton"
             onclick="changePlateRowsUI(1)"
            >＋</button>
          </div>
          <button
           class="plateRefreshButton"
           onclick="refreshPlateUI()"
          >再表示</button>
        </div>
        <!-- 範囲操作 -->
        <div class="plateSection">
         <div class="plateSectionTitle">範囲操作</div>
         <div class="plateWideButtonRow">
           <button onclick="selectAllPlateUI()">すべて選択</button>
           <button onclick="clearAllPlateUI()">すべて解除</button>
          </div>
        </div>
        <!-- 列選択 -->
        <div class="plateSection">
         <div class="plateSectionTitle">一列選択</div>
         <div
           id="plateColumnButtons"
           class="plateIndexArea"
          ><!-- JavaScriptで1〜8を作成 --></div>
        </div>
        <!-- 行選択 -->
        <div class="plateSection">
         <div class="plateSectionTitle"> 一行選択</div>
         <div
           id="plateRowButtons"
           class="plateIndexArea"
          ><!-- JavaScriptで1〜4を作成 --></div>
        </div>
        <!-- 説明 -->
        <div class="plateHelp">
         <div>マス：クリックで選択・解除</div>
         <div>列番号：クリックで一列選択</div>
         <div>行番号：クリックで一行選択</div>
        </div>
      </div>
    </div>
    <!-- 選択時UI -->
    <div id="objectUI" style="display:none;">
      <button
        id="backButton"
        onclick="backToDefaultUI()"
      >←</button>
      <h3>オブジェクト設定</h3>
      <p id="objectType">種類:</p>
      <p id="objectPosition">位置:</p>
      <p id="selectedKeyframeText">
        選択中キーフレーム: なし
      </p>
      <label>色</label>
      <input
        type="color"
        id="colorPicker"
        value="#ffff00"
      >
      <hr>
      <label>電源</label>
      <button
        id="powerButton"
        onclick="toggleTapeLight()"
      >OFF</button>
      <hr>
      <!-- テープライト選択時のUI -->
      <div id="tapeLightUI" style="display:none;">
        <label>向き</label>
        <br>
        <button onclick="setTapeDirection('left')">← 左</button>
        <button onclick="setTapeDirection('front')">前</button>
        <button onclick="setTapeDirection('right')">右 →</button>
        <button onclick="setTapeDirection('back')">後</button>
        <br><br>
        <input
         type="range"
         id="rotationSlider"
         min="0"
         max="360"
         value="0"
         oninput="updateRotationSlider(this.value)"
        >
        <p id="rotationValue">0°</p>
      </div>
      <!-- ムービングライト選択時のUI -->
      <div id="movingLightUI" style="display:none;">
        <div class="movingControlRow">
          <!-- 横方向 -->
          <div class="movingControlBox">
            <label>向き</label>
            <br>
            <button onclick="setMovingDirection('left')">左</button>
            <button onclick="setMovingDirection('front')">前</button>
            <button onclick="setMovingDirection('right')">右</button>
            <button onclick="setMovingDirection('back')">後</button>
            <br><br>
            <input
             type="range"
             id="movingRotationSlider"
             min="0"
             max="360"
             value="0"
             oninput="updateMovingRotationSlider(this.value)"
            >
            <div class="angleInputBox">
              <input
               type="number"
               id="movingRotationValue"
               class="angleInput"
               min="0"
               max="360"
               value="0"
               oninput="updateMovingRotationNumber(this.value)"
              >
              <span>°</span>
            </div>
          </div>
          <!-- 縦方向 -->
          <div class="movingControlBox">
            <label>縦方向</label>
            <br>
            <!-- 左側の方向ボタン分の空白 -->
            <div class="directionButtonSpace"></div>
            <input
             type="range"
             id="movingTiltSlider"
             min="-90"
             max="90"
             value="-30"
             oninput="updateMovingTiltSlider(this.value)"
            >
            <div class="angleInputBox">
            <input
             type="number"
             id="movingTiltValue"
             class="angleInput"
             min="-90"
             max="90"
             value="-30"
             oninput="updateMovingTiltNumber(this.value)"
            >
            <span>°</span>
          </div>
        </div>
      </div>
    </div>
      <hr>
      <button onclick="deleteSelectedObject()">
        削除
      </button>
    </div>
  </div>
  <!-- ↑ #ui 終了 -->
</div>
<!-- ↑ #mainArea 終了 -->
<!-- タイムラインはmainAreaの外 -->
<div id="timeline">
  <div id="timelineControls">
    <button onclick="playTimeline()">▶</button>
    <button onclick="pauseTimeline()">⏸</button>
    <button onclick="stopTimeline()">■</button>
    <input
      type="range"
      id="timeSlider"
      min="0"
      max="60"
      step="0.1"
      value="0"
      oninput="updateTimelineTime(this.value)"
    >
    <span id="currentTime">0.0s</span>
    <label>長さ</label>
    <input
      type="text"
      id="durationInput"
      value="60"
      style="width:60px; height:26px;"
      onkeydown="
        if(event.key === 'Enter') {
          changeTimelineDuration(this.value)
        }
      "
      onblur="changeTimelineDuration(this.value)"
    >
    <span>s</span>
    <button
      id="loopButton"
      onclick="toggleLoop()"
    >ループOFF</button>
    <input
      type="file"
      id="audioFile"
      accept=".mp3"
    >
  </div>
  <div id="timelineRuler">
    <div id="rulerHeader"></div>
    <div id="playhead"></div>
  </div>
  <div id="keyframeArea">
    <div id="playheadLine"></div>
    <div id="trackLabels"></div>
    <div id="keyframeInner"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
function onWindowResize() {
  camera.aspect =(window.innerWidth-300)/(window.innerHeight-300);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth-300,window.innerHeight-300);
}

let scene,camera,renderer;
let currentTime=0;
let isPlaying=false;
let light,sphere;
let lightOn=true;
let objects=[];
let selectedObject=null;
let selectedKeyframe = null;
let draggingKeyframe = null;
let copiedKeyframeData = null;
let isEditingKeyframe = false;
let raycaster=new THREE.Raycaster();
let mouse=new THREE.Vector2();
let isDragging=false;
let movingLightCount = 0;
let tapeLightCount=0;
let smartBulbCount = 0;
let isDraggingKeyframe = false;
let movedKeyframe = false;
let justDraggedKeyframe = false;
let controlMode = "object";
let lastHueSentKeyframe = null;
// 実機ムービングライトの最後に送ったTILT角度
let lastSentMovingTiltDegree = null;
let cameraYaw = 0;
let cameraPitch = 0;
let cameraDistance = 8;
let cameraTarget = new THREE.Vector3(0, 1.6, -4.5);
const TRACK_HEIGHT = 80;
const KEYFRAME_TOP_OFFSET = 34;
let timelineDuration = 60; // タイムライン長
let pixelsPerSecond = 50;  // 1秒=50px
let audio = new Audio();   // 音楽用
let isLoop = false;
let audioContext = null;
let audioBuffer = null;
let roomWidth = 11.0;  // 横（画像の横長空間に合わせた初期値）
let roomDepth = 18.0;   // 縦
let roomHeight = 4.2;  // 高さ（吹き抜けを表現するため高め）
const ROOM_SCALE = 1.0;
const FARM_STAGE = {
  width: 11.0,       // ステージ横幅
  depth: 3.8,       // ステージ奥行き
  height: 0.45      // ステージ高さ
};
let roomObjects = [];
let furnitureSnapSurfaces = [];
let planeMode = false; // プレーン選択モードかどうか
let wallBlocks = [];   // 表示するブロック
let selectedBlocks = []; // 選択されたブロック
let currentPlaneWall = "front"; // 今設定している壁
let ceilingFan1;
let ceilingFan2;
let roomLightOn = true;
let realisticLightingEnabled = false;


init();
createTimelineRuler();
updateTimelineHeight();
syncTimelineScroll();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  camera = new THREE.PerspectiveCamera(75,(window.innerWidth-300)/(window.innerHeight-300),0.1,1000);
  camera.position.set(0, 2.6, 7.5);
  camera.lookAt(cameraTarget);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setSize(window.innerWidth - 300, window.innerHeight-300);
  document.getElementById("scene").appendChild(renderer.domElement);
  // 環境光
  const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
  scene.add(ambientLight);
  createRoom();
  renderer.domElement.addEventListener("mousedown", onMouseDown);
  window.addEventListener("mousemove", onMouseMove);
  window.addEventListener("mouseup", onMouseUp);
  document
  .getElementById("colorPicker")
  .addEventListener("change", changeLightColor);
  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("resize",onWindowResize);
  window.addEventListener("wheel",onMouseWheel,{passive:false});
  document
  .getElementById("keyframeArea")

  function clearKeyframeSelection(event) {

      return;

    if (selectedKeyframe) {
      selectedKeyframe.classList.remove("selectedKeyframe");
      selectedKeyframe = null;

// 描画
function animate() {
  requestAnimationFrame(animate);
  // 再生中
  if (isPlaying) {
    if (audio.src) {
      currentTime = audio.currentTime;
    } else {
      currentTime += 0.016;
    }
    if (currentTime >= timelineDuration) {
      if (isLoop) {
        currentTime = 0;
        lastHueSentKeyframe = null;
        document.getElementById(
          "timelineRuler"
        ).scrollLeft = 0;
        document.getElementById(
          "keyframeArea"
        ).scrollLeft = 0;
      } else {
        currentTime = timelineDuration;
        isPlaying = false;
        turnOffAllLights();
      }
    }
  }
  // UI更新
  document.getElementById("timeSlider").value =currentTime;
  document.getElementById("currentTime").textContent =currentTime.toFixed(1) + "s";
  // タイムライン位置
  const timelineX = currentTime * 50;
  document.getElementById("playhead").style.left =(150 + timelineX) + "px";
  document.getElementById("playheadLine").style.left =(150 + timelineX) + "px";
  // 再生中だけ自動スクロール
  if (isPlaying) {
    const ruler =document.getElementById("timelineRuler");
    const keyframeArea =document.getElementById("keyframeArea");
    // 赤線中央基準
    const scrollPosition =timelineX - 200;
    // 最大スクロール量
    const maxScroll =keyframeArea.scrollWidth -keyframeArea.clientWidth;
    // 範囲制限
    const scrollX = Math.min(
      Math.max(0, scrollPosition),maxScroll
    );
    // 上下同期
    ruler.scrollLeft = scrollX;
    keyframeArea.scrollLeft = scrollX;
  }
  applyKeyframes();
  renderer.render(scene, camera);
}

// FARM 左右の可動ライト
function createFarmMovingLight(name,x,y,z,side) {
  // ライト全体
  const movingLight = new THREE.Group();
  movingLight.name = name;
  // ① 天井・壁への取り付け部分
  const mount = new THREE.Mesh(
    new THREE.BoxGeometry(0.28,0.12,0.28),
    mat(0x111111,0.7)
  );
  movingLight.add(mount);
  // ② PAN用グループ
  const panGroup =new THREE.Group();
  panGroup.position.y = -0.12;
  movingLight.add(panGroup);
  // ③ 支柱
  const armLeft =new THREE.Mesh(
      new THREE.BoxGeometry(0.06,0.28,0.06),
      mat(0x161616,0.7)
    );
  armLeft.position.set(-0.18,-0.14,0);
  panGroup.add(armLeft);
  const armRight =new THREE.Mesh(
      new THREE.BoxGeometry(0.06,0.28,0.06),
      mat(0x161616,0.7)
    );
  armRight.position.set(0.18,-0.14,0);
  panGroup.add(armRight);
  // ④ TILT用グループ
  // このGroupをX回転させることで上下方向にライトが動く
  const tiltGroup =new THREE.Group();
  tiltGroup.position.set(0,-0.18,0);
  panGroup.add(tiltGroup);
  // ⑤ ライト本体
  const body =new THREE.Mesh(
      new THREE.CylinderGeometry(0.18,0.23,0.34,24),
      mat(0x101010,0.6)
    );
  // 円筒を前後方向へ向ける
  body.rotation.x =Math.PI / 2;
  tiltGroup.add(body);
  // ⑥ レンズ
  const lens =new THREE.Mesh(
      new THREE.CircleGeometry(0.17,32),
      new THREE.MeshStandardMaterial({
        color: 0x555555,emissive: 0x000000,
        emissiveIntensity: 0,side: THREE.DoubleSide
      })
    );
  // 本体の前側
  lens.position.z = 0.175;
  tiltGroup.add(lens);
  // ⑦ 光の筋
  const beam =new THREE.Mesh(
      new THREE.CylinderGeometry(0.65,0.16,4.5,24),
      new THREE.MeshBasicMaterial({
        color: 0xffffff,transparent: true,opacity: 0.18,
        blending:THREE.AdditiveBlending,
        depthWrite: false,side:THREE.DoubleSide
      })
    );
  // CylinderはY方向に伸びるのでZ方向へ向ける
  beam.rotation.x =Math.PI / 2;
  // ライト前方へ伸ばす
  beam.position.z = 2.4;
  // 最初はOFF
  beam.visible = false;
  tiltGroup.add(beam);
  // ⑧ 実際に床や壁を照らすSpotLight
  const realLight =new THREE.SpotLight(
      0xffffff,0,20,Math.PI / 9,0.35,1.5
    );
  realLight.position.set(0,0,0.18);
  realLight.castShadow = false;
  tiltGroup.add(realLight);
  // SpotLightの照射先
  const target =new THREE.Object3D();
  target.position.set(0,0,5);
  tiltGroup.add(target);
  realLight.target = target;
  // ⑨ 会場内での位置
  movingLight.position.set(x,y,z);
  //ライト全体を
  movingLight.scale.set(0.7,0.7,0.7);
  // ⑩ 最初の向き
  // 少し下向き
  tiltGroup.rotation.x =THREE.MathUtils.degToRad(25);
  // 左右で少し中央方向を向かせる
  if (side === "left") {
    panGroup.rotation.y =THREE.MathUtils.degToRad(25);
  }
  else if (side === "right") {
    panGroup.rotation.y =THREE.MathUtils.degToRad(-25);
  }
  // ⑪ 既存UIで使う情報
  movingLight.userData.type ="ムービングライト";
  movingLight.userData.name =name;
  movingLight.userData.isOn =false;
  movingLight.userData.lightColor ="#ffffff";
  // 会場に固定
  movingLight.userData.locked =true;
  movingLight.userData.isFarmLight =true;
  // PAN
  movingLight.userData.head =panGroup;
  // TILT
  movingLight.userData.tiltHead =tiltGroup;
  // 発光面
  movingLight.userData.cap =lens;
  // 光の筋
  movingLight.userData.beam =beam;
  // 実際の光
  movingLight.userData.realLight =realLight;
  // 選択枠用
  movingLight.userData.base =mount;
  // ⑫ シーンへ追加
  addRoomObject(movingLight);
  // クリック選択できるようにする
  objects.push(movingLight);
  return movingLight;
}
// ステージライトを作る関数
function createStageLightPart(x,color = 0x222222) {
  const lightGroup = new THREE.Group();

  const mount = new THREE.Mesh(
    new THREE.BoxGeometry(0.10,0.12,0.10),mat(0x111111, 0.7)
  );

  );
  body.rotation.x =Math.PI / 2;
  body.position.set(0,-0.18,0.08);
  lightGroup.add(body);
  // ライト前面
  const lens =new THREE.Mesh(
    new THREE.CircleGeometry(0.145,24),

        color: color,emissive: color,

// FARM 真下向きライト
function createDownLight(name,x,y,z,color = 0xffffff) {
  // ライト全体
  const group = new THREE.Group();
  group.name = name;
  // ① 天井への取り付け部分
  const mount = new THREE.Mesh(
    new THREE.BoxGeometry(0.28,0.08,0.28),mat(0x111111,0.7)
  );
  group.add(mount);
  // ② 丸いライト本体
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22,0.27,0.18,32),mat(0x151515,0.7)
  );
  // Cylinderは最初から上下方向なので今回は回転させない
  body.position.y = -0.13;
  group.add(body);
  // ③ 下側のレンズ
  const lens = new THREE.Mesh(
    new THREE.CircleGeometry(0.21,32),
    new THREE.MeshStandardMaterial({
      color: color,emissive: color,emissiveIntensity: 0.8,
      side: THREE.DoubleSide
    })
  );
  // CircleGeometryは最初Z方向を向いているため、下向きにする
  lens.rotation.x =Math.PI / 2;
  lens.position.y =-0.225;
  group.add(lens);
  // ④ 光の見える部分
  // レンズ側は細く、下へ行くほど少し広がる
  const beamLength = 3.0;
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.20,0.60,beamLength,32),
    new THREE.MeshBasicMaterial({
      color: color,transparent: true,opacity: 0.12,
      blending:THREE.AdditiveBlending,
      depthWrite: false,side:THREE.DoubleSide
    })
  );

  // CylinderGeometryは元々Y方向なので、回転させず、そのまま真下へ伸ばす
  beam.position.y =-0.22 - beamLength / 2;
  group.add(beam);
  // ⑤ 実際に床を照らすSpotLight
  const realLight = new THREE.SpotLight(
    color,3,12,Math.PI / 7,0.35,1.5
  );
  realLight.position.set(0,-0.22,0);
  group.add(realLight);
  // ⑥ SpotLightを真下へ向ける
  const target =new THREE.Object3D();
  target.position.set(0,-5,0);
  group.add(target);
  realLight.target = target;
  // ⑦ 会場内の位置
  group.position.set(x,y,z);
  // ⑧ ライト情報
  group.userData.type ="真下ライト";
  group.userData.name =name;
  group.userData.isOn =true;
  group.userData.lightColor ="#" + color.toString(16).padStart(6, "0");
  // FARMでは位置固定
  group.userData.locked =true;
  group.userData.isFarmLight =true;
  group.userData.cap =lens;
  group.userData.beam =beam;
  group.userData.realLight =realLight;
  // ⑨ シーンへ追加
  addRoomObject(group);
  objects.push(group);
  return group;
}

  return group;

// ステージ左右の壁側ライト
function createSideStageLight(
  name,x,y,z,direction) {
  const lightGroup = new THREE.Group();
  lightGroup.name = name;
  // 壁への取り付け部分
  const mount = new THREE.Mesh(
    new THREE.BoxGeometry(0.12,0.18,0.18),mat(0x111111, 0.7)
  );
  lightGroup.add(mount);
  // ライト本体
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16,0.21,0.35,24),
    mat(0x181818, 0.65)
  );
  // 横向きにする
  body.rotation.z = Math.PI / 2;
  lightGroup.add(body);
  // レンズ
  const lens = new THREE.Mesh(
    new THREE.CircleGeometry(0.15,24),
    new THREE.MeshStandardMaterial({
      color: 0xddddff,
      emissive: 0xddddff,
      emissiveIntensity: 0.25,
      side: THREE.DoubleSide
    })
  );

  lens.rotation.y = Math.PI / 2;

  // 左右によってレンズ位置を変える
  lens.position.x =
    direction === "left"
      ? 0.18
      : -0.18;

  lightGroup.add(lens);


  // --------------------------
  // ライト全体の位置
  // --------------------------

  lightGroup.position.set(
    x,
    y,
    z
  );


  // --------------------------
  // ステージ中央方向へ少し向ける
  // --------------------------

  if (direction === "left") {

    lightGroup.rotation.y = -0.35;

  } else {

    lightGroup.rotation.y = 0.35;

  }


  addRoomObject(lightGroup);

  return lightGroup;
}

function createTimelineRuler() {
  const ruler = document.getElementById("timelineRuler");
  const keyframeInner = document.getElementById("keyframeInner");
  // 既存の秒数表示を消す
  ruler.querySelectorAll(".timeMark").forEach(mark => mark.remove());
  // 幅を計算
  const labelWidth = 150;
  const timelineWidth = timelineDuration * pixelsPerSecond;
  const totalWidth = labelWidth + timelineWidth;
  // keyframeInnerの幅も更新
  keyframeInner.style.width = timelineWidth + "px";
  // 0秒〜曲の長さまで目盛り作成
  for (let i = 0; i <= Math.ceil(timelineDuration); i++) {
    const mark = document.createElement("div");
    mark.className = "timeMark";
    mark.style.left = (labelWidth + i * pixelsPerSecond) + "px";
    mark.textContent = i + "s";
    ruler.appendChild(mark);
  }
  // スライダーの最大値も更新
  document.getElementById("timeSlider").max = timelineDuration;
}

function handleAudioFile(event) {
  event.target.blur();
  const file = event.target.files[0];
  if (!file) {
    timelineDuration = 60;
    audioBuffer = null;
    document.getElementById("durationInput").value = 60;
    createTimelineRuler();
    redrawTimelineTracks();
    return;
  }
  audio.src = URL.createObjectURL(file);
  audio.onloadedmetadata = function() {
    timelineDuration = audio.duration;
    document.getElementById("durationInput").value =
      Math.ceil(timelineDuration);
    document.getElementById("timeSlider").max =
      timelineDuration;
    if (currentTime > timelineDuration) {
      currentTime = 0;
    }
    createTimelineRuler();
    redrawTimelineTracks();
  };
  const reader = new FileReader();
  reader.onload = function(e) {
    const arrayBuffer = e.target.result;
    if (!audioContext) {
      audioContext = new AudioContext();
    }
    audioContext.decodeAudioData(
      arrayBuffer,
      function(buffer) {
        audioBuffer = buffer;
        redrawTimelineTracks();
      }
    );
  };
  reader.readAsArrayBuffer(file);
}

function drawWaveformToCanvas(canvas, buffer) {
  const ctx = canvas.getContext("2d");
  const width = canvas.width;
  const height = canvas.height;
  ctx.clearRect(0, 0, width, height);
  const data = buffer.getChannelData(0);
  const step = Math.ceil(data.length / width);
  const amp = height / 2;
  ctx.fillStyle = "rgba(120, 120, 255, 0.8)";
  for (let i = 0; i < width; i++) {
    let min = 1.0;
    let max = -1.0;
    for (let j = 0; j < step; j++) {
      const value = data[(i * step) + j];
      if (value < min) min = value;
      if (value > max) max = value;
    }
    ctx.fillRect(
      i,(1 + min) * amp,1,
      Math.max(1, (max - min) * amp)
    );
  }
}

function syncTimelineScroll() {
  const ruler = document.getElementById("timelineRuler");
  const keyframeArea =document.getElementById("keyframeArea");
  let syncingFromRuler = false;
  let syncingFromKeyframe = false;
  // 上 → 下
  ruler.addEventListener("scroll", () => {
    if (syncingFromKeyframe) return;
    syncingFromRuler = true;
    keyframeArea.scrollLeft = ruler.scrollLeft;
    fixTrackLabelsPosition();
    syncingFromRuler = false;
  });
  // 下 → 上
  keyframeArea.addEventListener("scroll", () => {
    fixTrackLabelsPosition();
    if (syncingFromRuler) return;
    syncingFromKeyframe = true;
    ruler.scrollLeft = keyframeArea.scrollLeft;
    syncingFromKeyframe = false;
  });
}

function turnOffAllLights() {
  objects.forEach(obj => {
    obj.userData.isOn = false;
    // テープライト
    if (obj.userData.type ==="テープライト") {
      obj.userData.lightSurface.material.color.set(0x555555);
      obj.userData.glow.visible = false;
    }
    // ムービングライト
    else if (obj.userData.type ==="ムービングライト") {
      obj.userData.cap.material.color.set(0x555555);
      obj.userData.beam.visible = false;
      if (obj.userData.realLight) {
        obj.userData.realLight.intensity = 0;
      }
    }
    // スマートライト
    else if (obj.userData.type ==="スマートライト") {
      obj.userData.lightSurface.material.color.set(0x555555);
      obj.userData.lightSurface.material.emissive.set(0x000000);
      obj.userData.lightSurface.material.emissiveIntensity = 0;
      obj.userData.glow.visible = false;
      if (obj.userData.realLight) {
        obj.userData.realLight.intensity = 0;
      }
      sendSmartLightPower(obj.userData.smartLightId,false);
    }
    // 実照明
    if (obj.userData.realLights) {
      obj.userData.realLights.forEach(
        light => {light.intensity = 0;}
      );
    }
  });
  // 実機テープライト消灯
  sendHuePower(false);
  // 実機DMX消灯
  sendColorToRealLight(0,0,0,0,0);
}

function stopTimeline() {
  // 再生停止
  isPlaying = false;
  if (audio.src) {
    audio.pause();
    audio.currentTime = 0;
  }
  // 時間を0へ
  currentTime = 0;
  // スライダー戻す
  document.getElementById("timeSlider").value = 0;

  document.getElementById("timelineRuler").scrollLeft = 0;

  // 全ムービングライトを初期向きへ
  objects.forEach(obj => {
    if (obj.userData.type === "ムービングライト") {
      // 3D側
      obj.userData.head.rotation.y = 0;
      obj.userData.tiltHead.rotation.x = -Math.PI / 6;

      obj.userData.isOn = false;
      obj.userData.cap.material.color.set(0x555555);
      obj.userData.beam.visible = false;
    }
  });
  // 実機も初期向きへ
  sendMovingPosition(0,-30);

  sendHuePower(false);
  // 実機DMXムービングライトを消灯
  sendColorToRealLight(0, 0, 0, 0, 0);

  if (
    selectedObject &&
    selectedObject.userData.type === "ムービングライト"
  ) {
    updateMovingRotationUI();
    updateMovingTiltUI();
  }
  // 連続送信防止リセット
  lastHueSentKeyframe = null;
  turnOffAllLights();
}

function addMovingLight(place = "floor", wallSide = null) {
  movingLightCount++;
  const movingLight = new THREE.Group();
  // 土台
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(1, 0.5, 1),
    new THREE.MeshStandardMaterial({ color: 0x222222 })
  );
  movingLight.add(base);
  movingLight.userData.base = base;
  // ヘッド全体
  const yokeGroup = new THREE.Group();
  // ヘッドグループ
  const headGroup = new THREE.Group();
  // 半球
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(
      0.4,32,32,0,Math.PI * 2,0,Math.PI / 2
    ),
    new THREE.MeshStandardMaterial({ color: 0x111111 })
  );
  dome.rotation.x = Math.PI;
  headGroup.add(dome);
  // フタ
  const cap = new THREE.Mesh(
    new THREE.CircleGeometry(0.4, 32),
    new THREE.MeshStandardMaterial({ color: 0x555555 })
  );
  cap.position.y = -0.001;
  cap.rotation.x = -Math.PI / 2;
  headGroup.add(cap);
  // 光の線
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.38,1.2,5,32),
    new THREE.MeshBasicMaterial({
      color: 0xffff00,transparent: true,opacity: 0.30,
      // ★光を加算して明るく見せる
      blending: THREE.AdditiveBlending,
      // ★透明物同士で不自然になりにくくする
      depthWrite: false,side: THREE.DoubleSide
    })
  );
  // 実際に周囲を照らすSpotLight
  const realLight = new THREE.SpotLight(
    0x00ccff,0,30,Math.PI / 8,0.4,1.5);
  realLight.position.set(0,0,0);
  // ヘッドに追加
  headGroup.add(realLight);
  // SpotLightが向く先
  const lightTarget =new THREE.Object3D();
  lightTarget.position.set(0,5,0);
  headGroup.add(lightTarget);
  realLight.target =lightTarget;
  // 重くなりやすいので影はOFF
  realLight.castShadow = false;
  // 保存
  movingLight.userData.realLight =realLight;
  beam.geometry.translate(0, -2.5, 0);
  beam.position.y = -0.02;
  beam.position.z = 0;
  beam.rotation.z = Math.PI;
  beam.visible = false;
  headGroup.add(beam);
  // ヘッド位置
  headGroup.position.y = 0.8;
  // 初期角度
  headGroup.rotation.y = Math.PI / 4;
  headGroup.rotation.x = -Math.PI / 6;
  yokeGroup.add(headGroup);
  movingLight.add(yokeGroup);
  // 設置位置
  const visualWidth = roomWidth * ROOM_SCALE;
  const visualDepth = roomDepth * ROOM_SCALE;
  const visualHeight = roomHeight * ROOM_SCALE;
  const halfW = visualWidth / 2;
  const halfD = visualDepth / 2;
  // 床に設置
  if (place === "floor") {
    movingLight.position.set(
      Math.random() * (visualWidth - 2) - (halfW - 1),
      0,
      Math.random() * (visualDepth - 2) - (halfD - 1)
    );
  }
  // 天井に設置
  else if (place === "ceiling") {
    movingLight.position.set(
      Math.random() * (visualWidth - 2) - (halfW - 1),
      visualHeight,
      Math.random() * (visualDepth - 2) - (halfD - 1)
    );
    movingLight.rotation.z = Math.PI;
  }
  // 壁に設置
  else if (place === "wall") {
    if (wallSide === "front") {
      movingLight.position.set(
        Math.random() * (visualWidth - 2) - (halfW - 1),
        Math.random() * (visualHeight - 2) + 1,
        halfD
      );
      movingLight.rotation.x = -Math.PI / 2;
      movingLight.userData.wallSide = "front";
    }
    else if (wallSide === "left") {
      movingLight.position.set(
        -halfW,
        Math.random() * (visualHeight - 2) + 1,
        Math.random() * (visualDepth - 2) - (halfD - 1)
      );
      movingLight.rotation.set(0, Math.PI, Math.PI / 2);
      movingLight.userData.wallSide = "left";
    }
    else if (wallSide === "back") {
      movingLight.position.set(
        Math.random() * (visualWidth - 2) - (halfW - 1),
        Math.random() * (visualHeight - 2) + 1,
        -halfD
      );
      movingLight.rotation.x = Math.PI / 2;
      movingLight.userData.wallSide = "back";
    }
    else if (wallSide === "right") {
      movingLight.position.set(
        halfW,
        Math.random() * (visualHeight - 2) + 1,
        Math.random() * (visualDepth - 2) - (halfD - 1)
      );
      movingLight.rotation.set(0, Math.PI, -Math.PI / 2);
      movingLight.userData.wallSide = "right";
    }
  }
  // 保存
  movingLight.userData.head = yokeGroup;
  movingLight.userData.tiltHead = headGroup;
  movingLight.userData.cap = cap;
  movingLight.userData.beam = beam;
  movingLight.userData.type = "ムービングライト";
  movingLight.userData.mountType = place;
  movingLight.userData.name =
    "ムービングライト" + movingLightCount;
  movingLight.userData.isOn = false;
  movingLight.userData.lightColor = "#00ccff";
  scene.add(movingLight);
  objects.push(movingLight);
  addTrackLabel(
    movingLight.userData.name,
    objects.length - 1
  );
  updateTimelineHeight();
  redrawTimelineTracks();
  updateRealLighting(movingLight);
}

function updateMovingTiltUI() {
  if (!selectedObject) return;
  if (selectedObject.userData.type !== "ムービングライト") return;
  const tiltHead = selectedObject.userData.tiltHead;
  const degree = THREE.MathUtils.radToDeg(tiltHead.rotation.x);
  document.getElementById("movingTiltSlider").value =
    degree;
  document.getElementById("movingTiltValue").value =
    Math.round(degree);
}

// テープライト（長方形）
function addTapeLight() {
  tapeLightCount++;
  // テープライト全体
  const tapeGroup = new THREE.Group();
  // U字の設定
  const radius = 1.4;       // U字の大きさ
  const thickness = 0.18;  // 黒い本体の太さ
  const height = 0.25;     // 発光面の高さ
  const segments = 32;     // なめらかさ
  // 切れ目の広さ
  const startAngle = Math.PI * 0.95;
  const endAngle   = Math.PI * 2.05;
  const arcLength =endAngle - startAngle;
  // ① U字型の黒い本体
  const bodyPoints = [];
  for (let i = 0; i <= segments; i++) {
    const t =i / segments;
    const angle =startAngle +arcLength * t;
    bodyPoints.push(
      new THREE.Vector3(Math.cos(angle) * radius,0,Math.sin(angle) * radius)
    );
  }
  // 点を滑らかにつなぐ
  const bodyCurve =new THREE.CatmullRomCurve3(bodyPoints);
  // U字型のチューブ
  const body =new THREE.Mesh(
      new THREE.TubeGeometry(
        bodyCurve,segments,thickness / 2,8,false
      ),
      new THREE.MeshStandardMaterial({color: 0x111111})
    );
  tapeGroup.add(body);
  // 選択枠用
  tapeGroup.userData.body =body;
  // ② 内側の発光面
  // ★複数のPlaneではなく1枚
  const lightMaterial =new THREE.MeshBasicMaterial({
      color: 0x555555,side: THREE.DoubleSide
    });
  // 頂点保存
  const vertices = [];
  // 面をつなぐ番号
  const indices = [];
  // 黒いチューブより少し内側
  const innerRadius =radius -thickness / 2 -0.01;
  // U字に沿って頂点を作る
  for (let i = 0; i <= segments; i++) {
    const t =i / segments;
    const angle =startAngle +arcLength * t;
    const x =Math.cos(angle) *innerRadius;
    const z =Math.sin(angle) *innerRadius;
    // 発光面の上側
    vertices.push(x,height / 2,z);
    // 発光面の下側
    vertices.push(x,-height / 2,z);
  }
  // 頂点同士を面としてつなぐ
  for (let i = 0; i < segments; i++) {
    const a = i * 2;
    const b = i * 2 + 1;
    const c = i * 2 + 2;
    const d = i * 2 + 3;
    indices.push(a, b, c,b, d, c);
  }
  // Geometry作成
  const lightGeometry =new THREE.BufferGeometry();
  lightGeometry.setAttribute("position",
    new THREE.Float32BufferAttribute(vertices,3)
  );
  lightGeometry.setIndex(indices);
  lightGeometry.computeVertexNormals();
  // ★1枚の連続した発光面
  const lightSurface =new THREE.Mesh(lightGeometry,lightMaterial);
  tapeGroup.add(lightSurface);
  // ③ 光の広がり glow
  const glowMaterial =
    new THREE.MeshBasicMaterial({
      color: 0xff00ff,transparent: true,opacity: 0.20,side: THREE.DoubleSide
    });
  const glow =new THREE.Group();
  // 既存処理との互換性
  glow.material =glowMaterial;
  // glowは小さいパーツを
  // U字に沿って並べる
  const circumference =arcLength * radius;
  const segmentWidth =circumference /segments *1.08;
  for (let i = 0; i < segments; i++) {
    const t =i / segments;
    const angle =startAngle +arcLength * t;
    const glowRadius =radius -thickness / 2 -0.12;
    const glowPart =new THREE.Mesh(
        new THREE.BoxGeometry(segmentWidth,0.12,0.25),
        glowMaterial
      );
    glowPart.position.set(
      Math.cos(angle) *glowRadius,0,
      Math.sin(angle) *glowRadius
    );
    // 中央方向へ向ける
    glowPart.rotation.y =-angle -Math.PI / 2;
    glow.add(glowPart);
  }
  // 最初はOFF
  glow.visible = false;
  tapeGroup.add(glow);
  // ④ 実際に周囲を照らす光
  // ★forループの外なので2個だけ
  const realLight1 =new THREE.PointLight(0xff00ff,0,6,2);
  realLight1.position.set(-0.7,0.25,0);
  realLight1.castShadow =false;
  tapeGroup.add(realLight1);
  const realLight2 =new THREE.PointLight(0xff00ff,0,6,2);
  realLight2.position.set(0.7,0.25,0);
  realLight2.castShadow =false;
  tapeGroup.add(realLight2);
  // 2つを保存
  tapeGroup.userData.realLights = [realLight1,realLight2];
  // ⑤ U字全体の見た目
  // 横に広げる
  tapeGroup.scale.set(1.5,1,1);
  // 初期方向
  tapeGroup.rotation.y =Math.PI *3/ 2;
  // ⑥ 最初の位置
  tapeGroup.position.set( Math.random() * 4 - 2,0.15, Math.random() * 4 - 2);
  // ⑦ 情報保存
  tapeGroup.userData.type ="テープライト";
  tapeGroup.userData.name ="テープライト" +tapeLightCount;
  // 家具スナップを使えるように
  tapeGroup.userData.mountType ="floor";
  // ON/OFF
  tapeGroup.userData.isOn =false;
  // 保存色
  tapeGroup.userData.lightColor ="#ff00ff";
  // 発光面
  tapeGroup.userData.lightSurface =lightSurface;
  // glow
  tapeGroup.userData.glow =glow;
  // ⑧ シーンへ追加
  scene.add(tapeGroup);
  objects.push(tapeGroup);
  addTrackLabel(tapeGroup.userData.name,objects.length - 1);
  redrawTimelineTracks();
  updateRealLighting(tapeGroup);
}

function toggleRealLighting(enabled) {
  realisticLightingEnabled = enabled;
  updateAllRealLighting();
}

function updateAllRealLighting() {
  objects.forEach(obj => {updateRealLighting(obj);});

}

function updateRealLighting(obj) {
  // 実照明モードOFF
  if (!realisticLightingEnabled) {
    if (obj.userData.realLight) {
      obj.userData.realLight.intensity = 0;
    }
    if (obj.userData.realLights) {
      obj.userData.realLights.forEach(light => {
        light.intensity = 0;
      });
    }
    return;
  }
  // ライト本体がOFFなら実照明もOFF
  if (!obj.userData.isOn) {
    if (obj.userData.realLight) {
      obj.userData.realLight.intensity = 0;
    }
    if (obj.userData.realLights) {
      obj.userData.realLights.forEach(light => {
        light.intensity = 0;
      });
    }
    return;
  }
  // ムービングライト
  if (obj.userData.type ==="ムービングライト") {
    obj.userData.realLight.color.set(obj.userData.lightColor);
    obj.userData.realLight.intensity = 3;
  }
  // スマートライト
  else if (obj.userData.type ==="スマートライト") {
    obj.userData.realLight.color.set(obj.userData.lightColor);
    obj.userData.realLight.intensity = 2;
  }
  // テープライト
  else if (obj.userData.type ==="テープライト"
  ) {
    obj.userData.realLights.forEach(light => {
      light.color.set(obj.userData.lightColor);
      light.intensity = 1.5;
    });
  }
}

// マウス操作
function onMouseDown(event) {
  event.preventDefault();
  mouse.x =(event.offsetX / renderer.domElement.clientWidth) * 2 - 1;
  mouse.y =-(event.offsetY / renderer.domElement.clientHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  // ✋ 画面移動モード
  if (controlMode === "hand") {
    isDragging = true;
    renderer.domElement.style.cursor = "grabbing";
    return;
  }
  // プレーン選択モード
  if (controlMode === "plane") {
    const hits = raycaster.intersectObjects(wallBlocks, true);
    if (hits.length > 0) {
      const block = hits[0].object;
      block.userData.selected =!block.userData.selected;
      // 選択
      if (block.userData.selected) {
        block.material.color.set(0x66cc66);
        block.material.opacity = 0.55;
        if (!selectedBlocks.includes(block)) {
          selectedBlocks.push(block);
        }
      }
      // 選択解除
      else {
        block.material.color.set(0xffffff);
        block.material.opacity = 0.18;
        selectedBlocks =selectedBlocks.filter(b => b !== block);
      }
    }
    // プレーンモードではライト選択処理に進ませない
    return;
  }
  // 通常のライト選択・移動モード
  isDragging = true;
  const intersects =raycaster.intersectObjects(objects, true);
  // 何もクリックしていない
  if (intersects.length === 0) {
    if (selectedObject) {
      removeOutline(selectedObject);
    }
    selectedObject = null;
    showDefaultUI();
    return;
  }
  // クリック対象取得
  const clickedObject = intersects[0].object;
  let newSelectedObject = clickedObject;
  // 一番上のGroupまでたどる
  while (
    newSelectedObject.parent &&
    newSelectedObject.parent !== scene
  ) {
    newSelectedObject = newSelectedObject.parent;
  }
  // 同じオブジェクトなら維持
  if (selectedObject === newSelectedObject) {
    return;
  }
  // 前回選択解除
  if (selectedObject) {
    removeOutline(selectedObject);
  }
  // 新しく選択
  selectedObject = newSelectedObject;
  // キーフレーム編集終了
  isEditingKeyframe = false;
  // キーフレーム選択解除
  if (selectedKeyframe) {
    selectedKeyframe.classList.remove("selectedKeyframe");
  }
  selectedKeyframe = null;
  updateSelectedKeyframeUI();
  showObjectUI(selectedObject);
  addOutline(selectedObject);
}

function onMouseUp() {
  isDragging = false;
  draggingKeyframe = null;
  if (controlMode === "hand") {
    renderer.domElement.style.cursor = "grab";
  }
  if (movedKeyframe) {
    justDraggedKeyframe = true;
    movedKeyframe = false;
    setTimeout(() => {
      justDraggedKeyframe = false;
    }, 50);
  }
}

function onMouseWheel(event) {
  // 3D画面以外なら無視
  if (!renderer.domElement.contains(event.target)) {
    return;
  }
  event.preventDefault();
  // カメラが向いている方向を取得
  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);
  // ズーム速度 小さいほど滑らか
  const zoomSpeed = 0.03;
  // 逆になっていたのでマイナスを付ける
  const moveAmount = -event.deltaY * zoomSpeed;
  // カメラを向いている方向に前後移動
  camera.position.addScaledVector(direction, moveAmount);
  // 距離を保存
  cameraDistance = camera.position.distanceTo(
    new THREE.Vector3(0, 0, 0)
  );
}

function onMouseMove(event) {
  // キーフレームをドラッグ中
  if (draggingKeyframe) {
    const keyframeArea =document.getElementById("keyframeArea");
    const rect =keyframeArea.getBoundingClientRect();
    let x =event.clientX -rect.left -150 +keyframeArea.scrollLeft;
    if (x < 0) {
      x = 0;
    }
    if (x > 3000) {
      x = 3000;
    }
    const oldX =parseFloat(draggingKeyframe.style.left);
    if (Math.abs(x - oldX) > 3) {
      movedKeyframe = true;
    }
    draggingKeyframe.style.left =x + "px";
    const time =x / pixelsPerSecond;
    draggingKeyframe.dataset.time =time;
    draggingKeyframe.title =time.toFixed(1) + "s";
    updateSelectedKeyframeUI();
    return;
  }
  // マウスを押していなければ終了
  if (!isDragging) {
    return;
  }
  // カメラモード
  if (controlMode === "camera") {
    cameraYaw -=event.movementX * 0.005;
    cameraPitch -=event.movementY * 0.005;
    const limit =Math.PI / 2 - 0.1;
    cameraPitch = Math.max(
      -limit,
      Math.min(limit, cameraPitch)
    );
    camera.position.x =
      cameraDistance *Math.cos(cameraPitch) *Math.sin(cameraYaw);
    camera.position.y =
      cameraDistance *Math.sin(cameraPitch);
    camera.position.z =
      cameraDistance *Math.cos(cameraPitch) *Math.cos(cameraYaw);
    camera.lookAt(cameraTarget);
    return;
  }
  // ✋ 画面移動モード
  if (controlMode === "hand") {
   const panSpeed = 0.015;
   // カメラから見た右方向
   const right = new THREE.Vector3();
   right.setFromMatrixColumn(camera.matrix, 0);
   // カメラから見た上方向
   const up = new THREE.Vector3();
   up.setFromMatrixColumn(camera.matrix, 1);
   // マウスの移動量
   const moveX = -event.movementX * panSpeed;
   const moveY = event.movementY * panSpeed;
   // カメラ自体を移動
   camera.position.addScaledVector(right, moveX);
   camera.position.addScaledVector(up, moveY);
   // 見ている中心位置も同時に移動
   cameraTarget.addScaledVector(right, moveX);
   cameraTarget.addScaledVector(up, moveY);
   // 新しい中心を見る
   camera.lookAt(cameraTarget);
   return;
  }
  // プレーン選択モード
  // プレーンモード中はライトを動かさない
  if (controlMode === "plane") {
    return;
  }
  // オブジェクトモード
  if (controlMode === "object") {
    if (!selectedObject) {
      return;
    }
    mouse.x =
      (event.offsetX /renderer.domElement.clientWidth) *2 -1;
    mouse.y =
      -(event.offsetY /renderer.domElement.clientHeight) *2 +1;
    raycaster.setFromCamera(
      mouse,camera
    );
    const point =new THREE.Vector3();
    let plane;
    const mountType =selectedObject.userData.mountType ||"floor";
    // 表示上の部屋サイズ
    const visualWidth =roomWidth * ROOM_SCALE;
    const visualDepth =roomDepth * ROOM_SCALE;
    const visualHeight =roomHeight * ROOM_SCALE;
    const halfW =visualWidth / 2;
    const halfD =visualDepth / 2;
    // FARM固定ライトはドラッグ移動させない
    if (selectedObject &&selectedObject.userData.locked) {
      return;
    }
    /// 床に設置したライト
    if (mountType === "floor") {
      // ① 家具にマウスが乗っているか確認
      const furnitureHits =raycaster.intersectObjects(furnitureSnapSurfaces,true);
      // 家具にマウスが乗っている
      if (furnitureHits.length > 0) {
       const furnitureHit = furnitureHits[0];
       let snapObject = furnitureHit.object;
       // snapSurfaceを持っている親まで探す
       while (snapObject &&!snapObject.userData.snapSurface) {snapObject = snapObject.parent;}
       if (snapObject) {
        // マウスが当たっている位置
        const x = furnitureHit.point.x;
        const z = furnitureHit.point.z;
        // 家具の天面の高さ
        let y = snapObject.userData.snapY;
        // レコード台のようにGroup内にある場合、親Groupの高さも考慮
        if (snapObject.parent instanceof THREE.Group) {
         y += snapObject.parent.position.y;
        }
        // ライト本体が家具に埋まらないように少し持ち上げる
        if (selectedObject.userData.type ==="ムービングライト") {
         y += 0.25;
        }
        else if (selectedObject.userData.type ==="テープライト") {
         y += 0.10;
        }
        else if(
          selectedObject.userData.type==="スマートライト"
        ){y+=0.05;}
        selectedObject.position.set(x,y,z);
        updatePositionUI(selectedObject);
        return;
      }
    }
    // ② 家具じゃなければ普通に床
    plane = new THREE.Plane(new THREE.Vector3(0, 1, 0),0);
    const hit =raycaster.ray.intersectPlane(plane,point);
    if (!hit) {return;}
    const x = Math.max(-halfW + 1,Math.min(halfW - 1, point.x));
    const z = Math.max(-halfD + 1,Math.min(halfD - 1, point.z));
    selectedObject.position.set(x,0,z);
  }
    // 天井に設置したライト
    else if (
      mountType === "ceiling"
    ) {
      plane = new THREE.Plane(
        new THREE.Vector3(0, 1, 0),-visualHeight
      );
      const hit =raycaster.ray.intersectPlane(plane,point);
      if (!hit) {return;}
      const x = Math.max(-halfW + 1,Math.min(halfW - 1,point.x));
      const z = Math.max(-halfD + 1,Math.min(halfD - 1,point.z));
      selectedObject.position.set(x,visualHeight,z);
    }
    // 壁に設置したライト
    else if (
      mountType === "wall"
    ) {
      const wallHits =
        raycaster
          .intersectObjects(roomObjects,true)
          .filter(hit =>hit.object.userData.surface === "wall");
      if (wallHits.length === 0) {return;}
      const hit =wallHits[0];
      const side =hit.object.userData.wallSide;
      const p =hit.point.clone();
      // 壁の上下端に少し余白を残す
      p.y = Math.max(1,Math.min(visualHeight - 1,p.y));
      // 前壁
      if (side === "front") {
        if (
          !isInsideSelectedBlock(p,"front")
        ) {
          return;
        }
        const x = Math.max(-halfW + 1,Math.min(halfW - 1,p.x));
        selectedObject.position.set(x,p.y,halfD);
        selectedObject.rotation.set(-Math.PI / 2,0,0);
      }
      // 左壁
      else if (
        side === "left"
      ) {
        if (
          !isInsideSelectedBlock(p,"left")
        ) {
          return;
        }
        const z = Math.max(
          -halfD + 1,Math.min(halfD - 1,p.z
          )
        );
        selectedObject.position.set(
          -halfW,
          p.y,
          z
        );
        selectedObject.rotation.set(
          0,
          Math.PI,
          Math.PI / 2
        );
      }
      // 後壁
      else if (
        side === "back"
      ) {
        if (
          !isInsideSelectedBlock(
            p,
            "back"
          )
        ) {
          return;
        }
        const x = Math.max(
          -halfW + 1,
          Math.min(
            halfW - 1,
            p.x
          )
        );
        selectedObject.position.set(
          x,
          p.y,
          -halfD
        );
        selectedObject.rotation.set(
          Math.PI / 2,
          0,
          0
        );
      }
      // 右壁
      else if (
        side === "right"
      ) {
        if (
          !isInsideSelectedBlock(
            p,
            "right"
          )
        ) {
          return;
        }
        const z = Math.max(
          -halfD + 1,
          Math.min(
            halfD - 1,
            p.z
          )
        );
        selectedObject.position.set(
          halfW,
          p.y,
          z
        );
        selectedObject.rotation.set(
          0,
          Math.PI,
          -Math.PI / 2
        );
      }
      selectedObject.userData.wallSide =
        side;
    }
    updatePositionUI(
      selectedObject
    );
  }
}

function showObjectUI(obj) {
  document.getElementById("defaultUI").style.display = "none";
  document.getElementById("objectUI").style.display = "block";
  const tapeUI =document.getElementById("tapeLightUI");
  const movingUI =document.getElementById("movingLightUI");
  // 一旦強制的に両方消す
  tapeUI.style.cssText = "display:none;";
  movingUI.style.cssText = "display:none;";
  // テープライト
  if (obj.userData.type === "テープライト") {
    tapeUI.style.cssText = "display:block;";
  }
  // ムービングライト
  else if (
    obj.userData.type === "ムービングライト"
  ) {
    movingUI.style.cssText = "display:block;";
  }
  else if (obj.userData.type ==="スマートライト") {
    tapeUI.style.cssText ="display:none;";
    movingUI.style.cssText ="display:none;";
  }
  // 種類表示追加
  document.getElementById("objectType").textContent ="種類: " + obj.userData.name;
  // 位置更新追加

function showWallBlocks() {
  // すでに表示されているブロックを削除
  clearWallBlocks();
  const visualWidth =roomWidth * ROOM_SCALE;
  const visualDepth =roomDepth * ROOM_SCALE;
  const visualHeight =roomHeight * ROOM_SCALE;
  const halfW =visualWidth / 2;
  const halfD =visualDepth / 2;
  // 分割数
  const cols = 8;
  const rows = 4;
  // 4つの壁
  const wallSides = [
    "front","back","left","right"
  ];
  wallSides.forEach(wallSide => {
    // 前後壁と左右壁では横幅が異なる
    let wallHorizontalSize;
    // 前壁・後壁は部屋の横幅を使う
    if (
      wallSide === "front" ||
      wallSide === "back"
    ) {
      wallHorizontalSize =visualWidth;
    }
    // 左壁・右壁は部屋の奥行きを使う
    else {
      wallHorizontalSize =visualDepth;
    }
    const blockWidth =wallHorizontalSize / cols;
    const blockHeight =visualHeight / rows;
    for (
      let row = 0;
      row < rows;row++
    ) {
      for (
        let col = 0;
        col < cols;
        col++
      ) {
        const block =
          new THREE.Mesh(
            new THREE.PlaneGeometry(
              blockWidth * 0.95,blockHeight * 0.95
            ),
            new THREE.MeshBasicMaterial({
              color: 0xcccccc,transparent: true,
              opacity: 0.25,side: THREE.DoubleSide,
              depthWrite: false
            })
          );
        // 壁面上の横位置
        const horizontalPosition =-wallHorizontalSize / 2 +
          blockWidth / 2 +col * blockWidth;
        // 壁面上の縦位置
        const y =blockHeight / 2 +row * blockHeight;
        // 前壁
        if (wallSide === "front") {
          block.position.set(
            horizontalPosition,
            y,halfD - 0.03
          );
          block.rotation.y =Math.PI;
        }
        // 後壁
        else if (
          wallSide === "back"
        ) {
          block.position.set(
            horizontalPosition,
            y,-halfD + 0.03
          );
          block.rotation.y = 0;
        }
        // 左壁
        else if (
          wallSide === "left"
        ) {
          block.position.set(
            -halfW + 0.03,
            y,horizontalPosition
          );
          block.rotation.y =Math.PI / 2;
        }
        // 右壁
        else if (
          wallSide === "right"
        ) {
          block.position.set(
            halfW - 0.03,
            y,horizontalPosition
          );
          block.rotation.y =-Math.PI / 2;
        }
        // ブロック情報
        block.userData.type ="wallBlock";
        block.userData.wallSide =wallSide;
        block.userData.col =col;
        block.userData.row =row;
        block.userData.blockWidth =blockWidth;
        block.userData.blockHeight =blockHeight;
        block.userData.selected =false;
        scene.add(block);
        wallBlocks.push(block);
      }
    }
  });
}

function clearWallBlocks() {
  wallBlocks.forEach(block => {
    scene.remove(block);
    block.geometry.dispose();
    block.material.dispose();
  });
  wallBlocks = [];
  // 削除済みブロックを選択配列に残さない
  selectedBlocks = [];
}

function showExistingWallBlocks() {
  wallBlocks.forEach(block => {
    block.visible = true;
  });
}

function hideWallBlocks() {
  wallBlocks.forEach(block => {
    block.visible = false;
  });
}

function isInsideSelectedBlock(
  point,
  wallSide
) {
  return selectedBlocks.some(
    block => {
      // 違う壁のブロックなら対象外
      if (
        block.userData.wallSide !==
        wallSide
      ) {
        return false;
      }
      const blockWidth =block.userData.blockWidth;
      const blockHeight =block.userData.blockHeight;
      const blockY =block.position.y;
      // 縦方向の判定
      const insideY =point.y >=blockY - blockHeight / 2 &&
        point.y <=blockY + blockHeight / 2;
      // 前壁・後壁
      // 横方向はx座標で判定
      if (
        wallSide === "front" ||
        wallSide === "back"
      ) {
        const blockX =block.position.x;
        const insideX =
          point.x >=blockX - blockWidth / 2 &&
          point.x <=blockX + blockWidth / 2;
        return insideX && insideY;
      }
      // 左壁・右壁
      // 横方向はz座標で判定
      if (
        wallSide === "left" ||
        wallSide === "right"
      ) {
        const blockZ =block.position.z;
        const insideZ =
          point.z >=blockZ - blockWidth / 2 &&
          point.z <=blockZ + blockWidth / 2;
        return insideZ && insideY;
      }
      return false;
    }
  );
}

function deleteSelectedObject() {
  if (!selectedObject) return;
  // 名前取得
  const name = selectedObject.userData.name;
  document.querySelectorAll(".keyframe").forEach(keyframe => {
    if (keyframe.dataset.target === name) {
      keyframe.remove();
    }
  });
  // ムービングライト番号取得
  if (selectedObject.userData.type ==="ムービングライト") {
    const match = name.match(/\d+/);
    if (match) {
      const deletedNumber =Number(match[0]);
      // 最後の番号なら戻す
      if (deletedNumber === movingLightCount) {
        movingLightCount--;
      }
    }
  }
  // テープライト番号取得
  if (selectedObject.userData.type ==="テープライト") {
    const match = name.match(/\d+/);
    if (match) {
      const deletedNumber =Number(match[0]);
      // 最後の番号なら戻す
      if (deletedNumber === tapeLightCount) {
        tapeLightCount--;
      }
    }
  }
  // シーンから削除
  scene.remove(selectedObject);
  // 配列から削除
  objects = objects.filter(obj => obj !== selectedObject);
  // 選択解除
  selectedObject = null;
  redrawTimelineTracks();
  // UI戻す
  showDefaultUI();
}

function changeLightColor(event) {
  const color = event.target.value;
  if (!selectedObject) return;
  // ●選択中ならキーフレームにも保存
  if (selectedKeyframe) {
    selectedKeyframe.dataset.color = color;
    selectedKeyframe.style.background = color;
  }
  // 3D側にも即反映
  selectedObject.userData.lightColor = color;
  if (selectedObject.userData.type === "テープライト") {
    if (selectedObject.userData.isOn) {
      selectedObject.userData.lightSurface.material.color.set(color);
      selectedObject.userData.glow.material.color.set(color);
      selectedObject.userData.glow.visible = true;
    } else {
      // OFF中は保存だけ
      selectedObject.userData.lightSurface.material.color.set(0x555555);
      selectedObject.userData.glow.visible = false;
    }
    sendHueColor(color);
  }
  else if (selectedObject.userData.type ==="スマートライト") {
    if (selectedObject.userData.isOn) {
     selectedObject.userData
       .lightSurface.material.color.set(color);
     selectedObject.userData
       .lightSurface.material.emissive.set(color);
     selectedObject.userData
       .glow.material.color.set(color);
     selectedObject.userData.glow.visible = true;
    } else {
      // OFFなら点灯させない
      selectedObject.userData
       .lightSurface.material.color.set(0x555555);
      selectedObject.userData
       .lightSurface.material.emissive.set(0x000000);
     selectedObject.userData.glow.visible = false;
    }
    sendSmartLightColor(selectedObject.userData.smartLightId,color);
  }
  else if (selectedObject.userData.type === "ムービングライト") {
    if (selectedObject.userData.isOn) {
      selectedObject.userData.cap.material.color.set(color);
      selectedObject.userData.beam.material.color.set(color);
      selectedObject.userData.beam.visible = true;
    } else {
      selectedObject.userData.cap.material.color.set(0x555555);
      selectedObject.userData.beam.visible = false;
    }
    const rgb = hexToRgb(color);
    sendColorToRealLight(rgb.r, rgb.g, rgb.b, 0, 100);
  }
  updateRealLighting(selectedObject);
}

function toggleTapeLight() {
  if (!selectedObject) return;
  const powerButton = document.getElementById("powerButton");
  let newState;
  // ●選択中
  if (selectedKeyframe) {
    const current = selectedKeyframe.dataset.isOn === "true";
    newState = !current;
    selectedKeyframe.dataset.isOn = newState.toString();
  }
  // 通常ライト選択中
  else {
    newState = !selectedObject.userData.isOn;
    selectedObject.userData.isOn = newState;
  }
  selectedObject.userData.isOn = newState;
  powerButton.textContent = newState ? "ON" : "OFF";
  if (selectedObject.userData.type === "テープライト") {
    if (newState) {
      selectedObject.userData.lightSurface.material.color.set(
        selectedObject.userData.lightColor
      );
      selectedObject.userData.glow.material.color.set(
        selectedObject.userData.lightColor
      );
      selectedObject.userData.glow.visible = true;
      sendHuePower(true);
    } else {
      selectedObject.userData.lightSurface.material.color.set(0x555555);
      selectedObject.userData.glow.visible = false;
      sendHuePower(false);
    }
  }
  else if (selectedObject.userData.type ==="スマートライト") {
    if (newState) {
      // 発光面
      selectedObject.userData
       .lightSurface.material.color
       .set(selectedObject.userData.lightColor);
      // emissiveも同じ色
      selectedObject.userData
       .lightSurface.material.emissive
       .set(selectedObject.userData.lightColor);
      selectedObject.userData
       .lightSurface.material.emissiveIntensity = 1.5;
      // glow
      selectedObject.userData
       .glow.material.color
       .set(selectedObject.userData.lightColor);
      selectedObject.userData.glow.visible = true;
      sendSmartLightPower(selectedObject.userData.smartLightId,true);
    } else {
      selectedObject.userData
       .lightSurface.material.color.set(0x555555);
      selectedObject.userData
       .lightSurface.material.emissive.set(0x000000);
      selectedObject.userData
       .lightSurface.material.emissiveIntensity = 0;
      selectedObject.userData.glow.visible = false;
      sendSmartLightPower(selectedObject.userData.smartLightId,false);
    }
  }
  else if (selectedObject.userData.type === "ムービングライト") {
    if (newState) {
      selectedObject.userData.cap.material.color.set(
        selectedObject.userData.lightColor
      );
      selectedObject.userData.beam.material.color.set(
        selectedObject.userData.lightColor
      );
      selectedObject.userData.beam.visible = true;
      const rgb = hexToRgb(selectedObject.userData.lightColor);
      sendColorToRealLight(rgb.r, rgb.g, rgb.b, 0, 100);
    } else {
      selectedObject.userData.cap.material.color.set(0x555555);
      selectedObject.userData.beam.visible = false;
      sendColorToRealLight(0, 0, 0, 0, 0);
    }
  }
  updateRealLighting(selectedObject);
}

// ムービングライト方向固定
function setMovingDirection(direction) {
  if (!selectedObject) return;
  if (selectedObject.userData.type !=="ムービングライト") return;
  let rotation;
  let realPanDegree;
  switch (direction) {
    case "front":
      // 3D
      rotation = 0;
      // 実機
      realPanDegree = 0;
      break;
    case "right":
      // 3D
      rotation =THREE.MathUtils.degToRad(90);
      // 実機
      realPanDegree = 60;
      break;
    case "back":
      // 3D
      rotation =THREE.MathUtils.degToRad(180);
      // 実機
      realPanDegree = 120;
      break;
    case "left":
      // 3D
      rotation =THREE.MathUtils.degToRad(270);
      // 実機
      realPanDegree = 180;
      break;
  }
  // 3Dモデルの向き
  selectedObject.userData.head.rotation.y = rotation;
  // キーフレーム保存
  if (selectedKeyframe) {
    selectedKeyframe.dataset.rotation =rotation;
  }
  // UI更新
  updateMovingRotationUI();
  // 実機へ送信
  sendMovingPanOnly(realPanDegree);
}

function updateMovingRotationSlider(value) {

// 向き固定ボタン
function setTapeDirection(direction) {
  let rotation = 0;
  switch(direction) {
    case "front":
      rotation = 0;
      break;
    case "left":
      rotation = THREE.MathUtils.degToRad(90);
      break;
    case "right":
      rotation = THREE.MathUtils.degToRad(270);
      break;
    case "back":
      rotation = THREE.MathUtils.degToRad(180);
      break;
  }
  // キーフレーム編集
  if (selectedKeyframe) {
    selectedKeyframe.dataset.rotation =rotation;
    const degree =THREE.MathUtils.radToDeg(rotation);
    document.getElementById("rotationSlider").value = degree;
    document.getElementById("rotationValue").value =Math.round(degree) + "°";
    return;
  }
  // ライト編集
  if (!selectedObject) return;
  if (
    selectedObject.userData.type !==
    "テープライト"
  ) return;
  selectedObject.rotation.y = rotation;
  updateRotationUI();
}

// スライダー回転
function updateRotationSlider(value) {
  if (selectedKeyframe) {
    selectedKeyframe.dataset.rotation =THREE.MathUtils.degToRad(value);
    document.getElementById("rotationValue").value =Math.round(value) + "°";
    return;
  }
  if (!selectedObject) return;
  if (
    selectedObject.userData.type !=="テープライト"
  ) return;
  // degree → radian
  selectedObject.rotation.y =THREE.MathUtils.degToRad(value);
  // 表示更新
  document.getElementById(
    "rotationValue"
  ).textContent =Math.round(value) + "°";
}

function selectObjectFromKeyframe(keyframe) {
  const targetName = keyframe.dataset.target;
  const targetObject = objects.find(obj =>
    obj.userData.name === targetName
  );
  if (!targetObject) return;
  // 前の黄色枠を消す
  if (selectedObject && selectedObject !== targetObject) {
    removeOutline(selectedObject);
    resetSelectedObjectToDefaultState();
  }
  // 選択中ライトを変更
  selectedObject = targetObject;
  // キーフレームの内容をライトに反映
  applyKeyframeStateToObject(keyframe, selectedObject);
  // UI更新
  showObjectUI(selectedObject);
  // 黄色枠追加
  addOutline(selectedObject);
}

function applyKeyframeStateToObject(keyframe, obj) {
  const color = keyframe.dataset.color;
  const isOn = keyframe.dataset.isOn === "true";
  const rotation = Number(keyframe.dataset.rotation);
  obj.userData.lightColor = color;
  obj.userData.isOn = isOn;
  // テープライト
  if (obj.userData.type === "テープライト") {
    obj.rotation.y = rotation;
    if (isOn) {
      obj.userData.lightSurface.material.color.set(color);
      obj.userData.glow.material.color.set(color);
      obj.userData.glow.visible = true;
    } else {
      obj.userData.lightSurface.material.color.set(0x555555);
      obj.userData.glow.visible = false;
    }
    updateRotationUI();
  }
  // ムービングライト
  else if (obj.userData.type === "ムービングライト") {
    obj.userData.head.rotation.y = rotation;
    if (keyframe.dataset.tilt !== undefined) {
      obj.userData.tiltHead.rotation.x =
        Number(keyframe.dataset.tilt);
    }
    if (isOn) {
      obj.userData.cap.material.color.set(color);
      obj.userData.beam.material.color.set(color);
      obj.userData.beam.visible = true;
    } else {
      obj.userData.cap.material.color.set(0x555555);
      obj.userData.beam.visible = false;
    }
    updateMovingRotationUI();
    updateMovingTiltUI();
  }
  // スマートライト
  else if (obj.userData.type ==="スマートライト") {
    if (isOn) {
      obj.userData.lightSurface.material.color.set(color);
      obj.userData.lightSurface.material.emissive.set(color);
      obj.userData.lightSurface.material.emissiveIntensity = 1.5;
      obj.userData.glow.material.color.set(color);
      obj.userData.glow.visible = true;
    } else {
      obj.userData.lightSurface.material.color.set(0x555555);
      obj.userData.lightSurface.material.emissive.set(0x000000);
      obj.userData.lightSurface.material.emissiveIntensity = 0;
      obj.userData.glow.visible = false;
  }
}
  document.getElementById("colorPicker").value = color;
  document.getElementById("powerButton").textContent =
    isOn ? "ON" : "OFF";
}

function updateRotationUI() {
