  updateMovingRotationSlider(degree);
}

function updateMovingTiltNumber(value) {
  if (value === "") return;
  let degree = Number(value);
  degree = Math.max(-90, Math.min(90, degree));
  document.getElementById("movingTiltSlider").value =
    degree;
  updateMovingTiltSlider(degree);
}

function onKeyDown(event) {
  // 入力欄を操作しているときは邪魔しない
  if (
    event.target.tagName === "INPUT" ||
    event.target.tagName === "TEXTAREA"
  ) {
    return;
  }
  // Ctrl+C
  if (event.ctrlKey && event.key === "c") {
    if (!selectedKeyframe) return;
    copiedKeyframeData = {
      color: selectedKeyframe.dataset.color,
      isOn: selectedKeyframe.dataset.isOn,
      rotation: selectedKeyframe.dataset.rotation,
      tilt: selectedKeyframe.dataset.tilt,
      target: selectedKeyframe.dataset.target
    };
    return;
  }
  // Ctrl+V
  if (event.ctrlKey && event.key === "v") {
    if (!copiedKeyframeData) return;
    if (!selectedObject) return;
    createCopiedKeyframe();
    return;
  }
  // Backspaceキー
  if (event.key === "Backspace") {
    event.preventDefault();
    // キーフレーム選択中なら●削除
    if (selectedKeyframe) {
      selectedKeyframe.remove();
      selectedKeyframe = null;
      updateSelectedKeyframeUI();
      return;
    }
    // ライト選択中ならライト削除
    if (selectedObject) {
      deleteSelectedObject();
    }
  }
}

function addOutline(obj) {

  if (!obj) return;

  // 選択された機材の中心位置を取得
  const box = new THREE.Box3().setFromObject(obj);

  const center = new THREE.Vector3();
  box.getCenter(center);

  // テスト用：かなり大きな黄色い球
  const geometry =
    new THREE.SphereGeometry(0.35, 16, 16);

  const material =
    new THREE.MeshBasicMaterial({
      color: 0xffff00,
      depthTest: false
    });

  const marker =
    new THREE.Mesh(
      geometry,
      material
    );

  marker.position.copy(center);

  marker.renderOrder = 9999;

  marker.raycast = () => {};

  scene.add(marker);

  obj.userData.outline = marker;
}
function removeOutline(obj) {

  if (!obj.userData.outline) return;


  const outline =
    obj.userData.outline;


  // 親から削除
  if (outline.parent) {

    outline.parent.remove(
      outline
    );

  }


  // geometry削除
  if (outline.geometry) {

    outline.geometry.dispose();

  }


  // material削除
  if (outline.material) {

    outline.material.dispose();

  }


  obj.userData.outline = null;
}

function applyKeyframes() {
  // 全キーフレーム取得
  const keyframes = document.querySelectorAll(".keyframe");
  keyframes.forEach(keyframe => {
    // 保存時間
    const keyTime = Number(keyframe.dataset.time);
    // 保存色
    const color = keyframe.dataset.color;
    const isOn =keyframe.dataset.isOn === "true";
    const rotation =Number(keyframe.dataset.rotation);
    // 保存対象ライト名
    const targetName = keyframe.dataset.target;
    // 時間一致
    if (Math.abs(currentTime - keyTime) < 0.1) {
      objects.forEach(obj => {
        // 対象ライトだけ実行
        if (obj.userData.name !== targetName) return;
        // テープライト
        if (obj.userData.type === "テープライト") {
          // 向き適用
          obj.rotation.y = rotation;
          // ON/OFF適用
          obj.userData.isOn = isOn;
          obj.userData.lightColor = color;
          if (isOn) {
            obj.userData.lightSurface.material.color.set(color);
            obj.userData.glow.material.color.set(color);
            obj.userData.glow.visible = true;
            const keyId =targetName + "_" +keyTime.toFixed(1);
            if (lastHueSentKeyframe !== keyId) {
              sendHueColor(color);
              lastHueSentKeyframe = keyId;
            }
          }
          else {
            obj.userData.lightSurface.material.color.set(0x555555);
            obj.userData.glow.visible = false;
            const keyId =targetName + "_" +keyTime.toFixed(1);
            if (lastHueSentKeyframe !== keyId) {
              sendHuePower(false);
              lastHueSentKeyframe = keyId;
            }
          }
          updateRealLighting(obj);
        }
        // ムービングライト
        if (obj.userData.type === "ムービングライト") {
          obj.userData.head.rotation.y = rotation;
          let tilt=obj.userData.tiltHead.rotation.x;
          if (keyframe.dataset.tilt !== undefined) {
            tilt = Number(keyframe.dataset.tilt);
            obj.userData.tiltHead.rotation.x =tilt;
          }
          // ON/OFF適用
          obj.userData.isOn = isOn;
          obj.userData.lightColor = color;
          if (isOn) {
            obj.userData.cap.material.color.set(color);
            obj.userData.beam.material.color.set(color);
            obj.userData.beam.visible = true;
          }
          else {
            obj.userData.cap.material.color.set(0x555555);
            obj.userData.beam.visible = false;
          }
          const panDegree =THREE.MathUtils.radToDeg(rotation);
          const fixedPan =((panDegree % 360) + 360) % 360;
          const realPanDegree =convert3DPanToRealPan(fixedPan);
          const tiltDegree =THREE.MathUtils.radToDeg(tilt);
          const keyId =targetName + "_" +keyTime.toFixed(1) + "_" +
           color + "_" +isOn + "_" +fixedPan + "_" +tiltDegree;
          if (lastHueSentKeyframe !== keyId) {
            sendMovingLightToRealLight(color, isOn);
            sendMovingPanOnly(realPanDegree);
            const fixedTiltDegree =Math.round(tiltDegree * 10) / 10;
            if (lastSentMovingTiltDegree === null) {
              sendMovingTiltOnly(fixedTiltDegree);
            }
            else {const fixedLastTilt =
              Math.round(lastSentMovingTiltDegree * 10) / 10;
              if (Math.abs(fixedTiltDegree -fixedLastTilt) >= 0.5) {
                sendMovingTiltOnly(fixedTiltDegree);
              }
            }
          }
          updateRealLighting(obj);
        }
        // スマートライト
        if (obj.userData.type ==="スマートライト") {
          obj.userData.isOn = isOn;
          obj.userData.lightColor = color;
          // ON
          if (isOn) {
           // 電球表面の色
           obj.userData.lightSurface.material.color.set(color);
           // 発光色
           obj.userData.lightSurface.material.emissive.set(color);
           obj.userData.lightSurface.material.emissiveIntensity = 1.5;
           // glow
           obj.userData.glow.material.color.set(color);
           obj.userData.glow.visible = true;
           const keyId =targetName + "_" +keyTime.toFixed(1) +"_" + color +"_smart_on";
           if (lastHueSentKeyframe !== keyId) {
             sendSmartLightColor(obj.userData.smartLightId,color);
             lastHueSentKeyframe = keyId;
           }
          }
          // OFF
          else {
           obj.userData.lightSurface.material.color.set(0x555555);
           obj.userData.lightSurface.material.emissive.set(0x000000);
           obj.userData.lightSurface.material.emissiveIntensity = 0;
           obj.userData.glow.visible = false;
           const keyId =targetName + "_" +keyTime.toFixed(1) +"_smart_off";
           if (lastHueSentKeyframe !== keyId) {
             sendSmartLightPower(obj.userData.smartLightId,false);
             lastHueSentKeyframe = keyId;
            }
          }
        }
        updateRealLighting(obj);
      });
    }
  });
}

function updateSelectedKeyframeUI() {
  // 選択なし
  if (!selectedKeyframe) {
    document.getElementById("selectedKeyframeText").textContent =
      "選択中キーフレーム: なし";
    return;
  }
  // 時間取得
  const time = Number(selectedKeyframe.dataset.time);
  document.getElementById("selectedKeyframeText").textContent =
    "選択中キーフレーム: " + time.toFixed(1) + "秒";
  // 色
  document.getElementById("colorPicker").value =
    selectedKeyframe.dataset.color;
  // 電源
  document.getElementById("powerButton").textContent =
    selectedKeyframe.dataset.isOn === "true" ? "ON" : "OFF";
  // テープライト
  if (
    selectedObject &&
    selectedObject.userData.type === "テープライト"
  ) {
    const degree =
      THREE.MathUtils.radToDeg(
        Number(selectedKeyframe.dataset.rotation)
      );
    document.getElementById("rotationSlider").value = degree;
    document.getElementById("rotationValue").textContent =
      Math.round(degree) + "°";
  }
  // ムービングライト
  if (
    selectedObject &&
    selectedObject.userData.type === "ムービングライト"
  ) {
    const degree =
      THREE.MathUtils.radToDeg(
        Number(selectedKeyframe.dataset.rotation)
      );
    document.getElementById("movingRotationSlider").value = degree;
    // number入力なので「°」は付けない
    document.getElementById("movingRotationValue").value =
      Math.round(degree);
    // 縦方向
    if (selectedKeyframe.dataset.tilt !== undefined) {
      const tiltDegree =
        THREE.MathUtils.radToDeg(
          Number(selectedKeyframe.dataset.tilt)
        );
      document.getElementById("movingTiltSlider").value =
        tiltDegree;
      document.getElementById("movingTiltValue").value =
        Math.round(tiltDegree);
    }
  }
}

function sendColorToRealLight(r, g, b, w = 0, master = 100) {
  fetch("http://127.0.0.1:5000/dmx/set_color", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      r: r,
      g: g,
      b: b,
      w: w,
      master: master
    })
  })
  .then(response => response.json())
  .then(data => {
    console.log("実機ライトへ送信成功:", data);
  })
  .catch(error => {
    console.error("実機ライト送信エラー:", error);
  });
}

function sendMovingPosition(panDegree, tiltDegree) {
  // 横方向 0～360° → DMX 0～255
  let pan = Math.round((panDegree / 360) * 255);
  // 縦方向 -90～90° → DMX 0～255
  let tilt;
  if (tiltDegree === -30) {tilt = 60;
  } 
  else {
    tilt = Math.round(((tiltDegree + 90) / 180) * 255);
  }
  // 念のため0～255に制限
  pan = Math.max(0, Math.min(255, pan));
  tilt = Math.max(0, Math.min(255, tilt));
  fetch("http://127.0.0.1:5000/dmx/set_position", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      pan: pan,
      tilt: tilt
    })
  })
  .then(response => response.json())
  .then(data => {
    console.log("実機ムービング向き送信成功:", data);
  })
  .catch(error => {
    console.error("実機ムービング向き送信エラー:", error);
  });
}

function sendMovingPanOnly(panDegree) {

  // 実機用角度 → DMX 0～255
  let pan = Math.round(
    (panDegree / 360) * 255
  );

  pan = Math.max(
    0,
    Math.min(255, pan)
  );

  fetch(
    "http://127.0.0.1:5000/dmx/set_pan",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        pan: pan
      })
    }
  );
}

function sendMovingTiltOnly(tiltDegree) {

  // 小数誤差対策
  const fixedTiltDegree =
    Math.round(tiltDegree * 10) / 10;

  let tilt;


  // 初期位置
  // 3D -30° = 実機DMX 60
  if (
    Math.abs(
      fixedTiltDegree - (-30)
    ) < 0.5
  ) {

    tilt = 60;

  } else {

    tilt = Math.round(
      (
        (fixedTiltDegree + 90) /
        180
      ) * 255
    );
  }


  tilt = Math.max(
    0,
    Math.min(255, tilt)
  );


  fetch(
    "http://127.0.0.1:5000/dmx/set_tilt",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        tilt: tilt
      })
    }
  );


  // 最後に送った縦角度を保存
  lastSentMovingTiltDegree =
    fixedTiltDegree;
}

function convert3DPanToRealPan(panDegree) {
  // 0～360°に正規化
  const fixed =
    ((panDegree % 360) + 360) % 360;
  return fixed * (2 / 3);
}

function hexToRgb(hex) {
  hex = hex.replace("#", "");
  return {
    r: parseInt(hex.substring(0,2),16),
    g: parseInt(hex.substring(2,4),16),
    b: parseInt(hex.substring(4,6),16)
  };
}

function sendMovingLightToRealLight(color, isOn) {
  if (isOn) {
    const rgb = hexToRgb(color);
    sendColorToRealLight(rgb.r, rgb.g, rgb.b, 0, 100);
  } else {
    sendColorToRealLight(0, 0, 0, 0, 0);
  }
}

function resetSelectedObjectToDefaultState() {
  if (!selectedObject) return;
  selectedObject.userData.isOn = false;
  if (selectedObject.userData.type === "テープライト") {
    selectedObject.userData.lightSurface.material.color.set(0x555555);
    selectedObject.userData.glow.visible = false;
    if (selectedObject.userData.realLights) {
      selectedObject.userData.realLights.forEach(
        light => {light.intensity = 0;}
      );
    }
  }
  else if (selectedObject.userData.type === "ムービングライト") {
    selectedObject.userData.cap.material.color.set(0x555555);
    selectedObject.userData.beam.visible = false;
    if (selectedObject.userData.realLight) {
      selectedObject.userData.realLight.intensity = 0;
    }
    selectedObject.userData.head.rotation.y = 0;
    selectedObject.userData.tiltHead.rotation.x = -Math.PI / 6;
    sendMovingPosition(0,-30);
  }
  else if (selectedObject.userData.type ==="スマートライト") {
    // 電球表面をOFF色へ
    selectedObject.userData.lightSurface.material.color.set(0x555555);
    // emissiveを消す
    if (selectedObject.userData.lightSurface.material.emissive
    ) {
      selectedObject.userData.lightSurface.material.emissive.set(0x000000);
      selectedObject.userData.lightSurface.material.emissiveIntensity = 0;
    }
    // glowを消す
    selectedObject.userData.glow.visible = false;
    // 実照明PointLightも消す
    if (selectedObject.userData.realLight) {
      selectedObject.userData.realLight.intensity = 0;
    }
  }
  // UI更新
  document.getElementById("powerButton").textContent = "OFF";
  updateSelectedKeyframeUI();
  if (selectedObject.userData.type === "ムービングライト") {
    updateMovingRotationUI();
    updateMovingTiltUI();
  }
  if (selectedObject.userData.type === "テープライト") {
    updateRotationUI();
  }
}
