<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>照明シミュレーター</title>
  <style>
    body {
     margin: 0;
     display: flex;
     flex-direction: column;
     height: 100vh;
     overflow: hidden;
    }
    #mainArea {
     flex: 1;
     display: flex;
    }
    #scene {
     flex: 1;
     overflow: hidden;
     position: relative;
    }
    #ui {
     width: 300px;
     background: #eee;
     padding: 10px;
    }
    #timeline {
     height: 300px;
     background: #222;
     color: white;
     border-top: 2px solid #444;
     padding: 10px;
     display: flex;
     flex-direction: column;
     box-sizing: border-box;
    }
    #timelineControls button {
     width: 40px;
     height: 30px;
     font-size: 16px;
    }
    #timelineControls #loopButton {
     width: auto;
     width: 95px;
     height: 30px;
     padding: 0 10px;
     font-size: 14px;
     background: #f0f0f0;
     color: black;
     border: 1px solid #888;
     border-radius: 2px;
     cursor: pointer;
    }
    #timelineControls #loopButton.loopOn {
     background: yellow;
     color: black;
    }
    #timelineRuler {
     position: relative;
     height: 30px;
     background: #333;
     border-bottom: 1px solid #555;
     overflow-x: auto;
     overflow-y: hidden;
     white-space: nowrap;
     -webkit-overflow-scrolling: touch;
    }
    .timeMark {
     position: absolute;
     top: 5px;
     color: white;
     font-size: 12px;
    }
    #playhead {
     position: absolute;
     top: 0;
     left: 200px;
     width: 2px;
     height: 100%;
     background: red;
     z-index: 999;
     pointer-events: none;
    }
    #keyframeArea {
     position: relative;
     height: 240px;
     background: #1e1e1e;
     overflow-x: auto;
     overflow-y: auto;
     border-top: 1px solid #555;
     -webkit-overflow-scrolling: touch;
    }
    #trackLabels {
     position: absolute;
     left: 0;
     top: 0;
     width: 150px;
     height: 100%;
     background: #2a2a2a;
     z-index: 1000;
     border-right: 1px solid #555;
     pointer-events: none;
    }
    #rulerHeader {
     position: absolute;
     left: 0;
     top: 0;
     width: 150px;
     height: 100%;
     background: #2a2a2a;
     z-index: 1000;
     border-right: 1px solid #555;
    }
    .trackLabel {
     height: 80px;
     line-height: 80px;
     padding-left: 12px;
     color: white;
     border-bottom: 1px solid #444;
     box-sizing: border-box;
     font-size: 14px;
     background: #2a2a2a;
     width: 150px;
    }
    #playheadLine {
     position: absolute;
     top: 0;
     left: 200px;
     width: 2px;
     height: 100%;
     background: red;
     z-index: 999;
     pointer-events: none;
    }
    #timelineRuler::-webkit-scrollbar,
    #keyframeArea::-webkit-scrollbar {
     display: none;
    }
    .waveformCanvas {
     position: absolute;
     left: 0;
     top: 8px;
     height: 55px;
     z-index: 1;
     pointer-events: none;
     opacity: 0.85;
    }
    .keyframe {
     position: absolute;
     width: 12px;
     height: 12px;
     background: orange;
     border-radius: 50%;
     top: 20px;
     transform: translateX(-50%);
     cursor: pointer;
     z-index: 5;
    }
    .selectedKeyframe {
     outline: 2px solid yellow;
    }
    #backButton {
     width: 28px;
     height: 28px;
     font-size: 14px;
     padding: 0;
     margin-bottom: 4px;
     cursor: pointer;
    }
    #keyframeInner {
     position: relative;
     width: 3000px;
     height: 100%;
     margin-left: 150px;
    }
    #modeButtons {
     position: absolute;
     bottom: 20px;
     left: 20px;
     display: flex;
     gap: 10px;
     z-index: 1000;
    }
    #modeButtons button {
     width: 60px;
     height: 60px;
     font-size: 24px;
     border: none;
     border-radius: 12px;
     background: rgba(50,50,50,0.8);
     color: white;
     cursor: pointer;
    }
    #modeButtons button.active {
     background: orange;
    }
    .lightButton{
     width:100%;
     height:120px;
     display:flex;
     flex-direction:column;
     align-items:center;
     justify-content:center;
     gap:8px;
     margin-bottom:10px;
     cursor:pointer;
    }
    .lightPanel {
     width: 100%;
     min-height: 170px;
     border: 1px solid #888;
     margin-bottom: 10px;
     padding: 10px;
     box-sizing: border-box;
     text-align: center;
    }
    .lightTitle {
     font-size: 18px;
     margin-bottom: 10px;
    }
    .mountButtons {
     display: flex;
     gap: 8px;
     justify-content: center;
     margin-bottom: 10px;
    }
    .mountButtons button {
     width: 70px;
     height: 32px;
     font-size: 15px;
     cursor: pointer;
    }
    .lightButton img{
     width:70px;
     height:70px;
     object-fit:contain;
    }
    .movingControlRow {
     display: flex;
     gap: 18px;
    }
    .movingControlBox {
     flex: 1;
    }
    .directionButtonSpace {
     height: 34px;
     margin-bottom: 16px;
    }
    .movingControlBox input[type="range"] {
     width: 100%;
    }
    .angleInputBox{
     display:flex;
     align-items:center;
     gap:4px;
     margin-top:8px;
    }
    .angleInput {
     width: 45px;
     height: 24px;
     font-size: 16px;
     margin-top: 8px;
    }
    .angleInputBox span{
     font-size:20px;
     font-weight:bold;
    }
    .wallButtonWrap {
     position: relative;
    }
    .wallMenu {
     display: none;
     position: absolute;
     top: 40px;
     left: -45px;
     background: white;
     border: 1px solid #888;
     padding: 8px;
     z-index: 2000;
     box-shadow: 0 2px 6px rgba(0,0,0,0.25);
     white-space: nowrap;
    }
    .wallMenu::before {
     content: "";
     position: absolute;
     top: -8px;
     left: 55px;
     border-left: 8px solid transparent;
     border-right: 8px solid transparent;
     border-bottom: 8px solid white;
    }
    .wallMenu button {
     width: 45px;
     height: 30px;
     margin: 2px;
    }
    .menuButton {
     width: 100%;
     height: 70px;
     margin-bottom: 12px;
     font-size: 22px;
     cursor: pointer;
    }
    .menuBackButton {
     width: 40px;
     height: 34px;
     margin-bottom: 8px;
     font-size: 18px;
     cursor: pointer;
    }
    #roomSettingUI label {
     display: inline-block;
     width: 45px;
     margin-bottom: 10px;
    }
  </style>
</head>
<body>
<div id="mainArea">
  <!-- 3D画面 -->
  <div id="scene">
    <div id="modeButtons">
      <button id="cameraModeButton">📷</button>
      <button id="objectModeButton">💡</button>
    </div>
  </div>
  <!-- 右側UI -->
  <div id="ui">
    <!-- 通常UI -->
    <div id="defaultUI">
      <!-- 最初のメニュー -->
      <div id="mainMenuUI">
        <h3>操作パネル</h3>
        <button onclick="toggleLight()">
          環境光 ON/OFF
        </button>
        <hr>
        <button
          class="menuButton"
          onclick="showRoomUI()"
        >部屋</button>
        <button
          class="menuButton"
          onclick="showLightUI()"
        >ライト</button>
        <button
          class="menuButton"
          onclick="showPlateUI()"
        >プレート</button>
      </div>
      <!-- 部屋設定ページ -->
      <div id="roomSettingUI" style="display:none;">
        <button
          class="menuBackButton"
          onclick="showMainMenuUI()"
        >←</button>
        <h3>部屋設定</h3>
        <h4>部屋サイズ</h4>
        <label>横</label>
        <input
          type="number"
          id="roomWidthInput"
          value="8"
          style="width:60px;"
        >m<br>
        <label>縦</label>
        <input
          type="number"
          id="roomDepthInput"
          value="8"
          style="width:60px;"
        >m<br>
        <label>高さ</label>
        <input
          type="number"
          id="roomHeightInput"
          value="3"
          style="width:60px;"
        >m<br><br>
        <button onclick="updateRoomSize()">
          部屋サイズ変更
        </button>
      </div>
      <!-- ライト選択ページ -->
      <div id="lightSelectionUI" style="display:none;">
        <button
          class="menuBackButton"
          onclick="showMainMenuUI()"
        >←</button>
        <h3>ライト選択</h3>
        <div class="lightPanel">
          <div class="lightTitle">
            ムービングライト
          </div>
          <div class="mountButtons">
            <button onclick="addMovingLight('floor')">床</button>
            <div class="wallButtonWrap">
              <button onclick="toggleWallMenu()">壁</button>
              <div id="wallMenu" class="wallMenu">
                <button
                  onclick="addMovingLight('wall','front')"
                >前</button>
                <button
                  onclick="addMovingLight('wall','left')"
                >左</button>
                <button
                  onclick="addMovingLight('wall','back')"
                >後</button>
                <button
                  onclick="addMovingLight('wall','right')"
                >右</button>
              </div>
            </div>
            <button onclick="addMovingLight('ceiling')">天井</button>
          </div>
        </div>
        <button
          class="lightButton"
          onclick="addTapeLight()"
        >
          <div>テープライト</div>
          <img
            src="テープライト.png"
            alt="テープライト"
          >
        </button>
      </div>
      <!-- プレート設定ページ -->
      <div id="plateSettingUI" style="display:none;">
       <!-- 上部 -->
       <div class="plateHeader">
         <button
           class="menuBackButton"
           onclick="closePlateUI()"
          >←</button>
          <div class="plateHeaderTitle">プレート設定</div>
          <button
           id="platePowerButton"
           class="platePowerButton active"
           onclick="togglePlatePowerUI()"
          >ON</button>
        </div>
        <!-- 選択状態 -->
        <div class="plateStatus">
         <span id="currentWallText">前壁</span>
         <span id="plateDivisionText">縦4マス×横8マス</span>
         <span id="selectedPlateCount">選択中：0マス/32マス</span>
        </div>
        <!-- 壁面選択 -->
        <div class="plateSection">
         <div class="plateSectionTitle">壁面選択</div>
         <div class="plateWallButtons">
           <button
             class="plateWallButton active"
             data-wall="front"
             onclick="selectPlateWallUI(this, '前壁')"
            >前壁</button>
            <button
             class="plateWallButton"
             data-wall="back"
             onclick="selectPlateWallUI(this, '後壁')"
            >後壁</button>
            <button
             class="plateWallButton"
             data-wall="left"
             onclick="selectPlateWallUI(this, '左壁')"
            >左壁</button>
            <button
             class="plateWallButton"
             data-wall="right"
             onclick="selectPlateWallUI(this, '右壁')"
            >右壁</button>
          </div>
        </div>
        <!-- マス数設定 -->
        <div class="plateSection">
         <div class="plateSectionTitle">マス(分割)数設定</div>
         <!-- 横 -->
         <div class="plateNumberRow">
           <span class="plateNumberLabel">横（列）数</span>
           <button
             class="plateSmallButton"
             onclick="changePlateColumnsUI(-1)"
            >−</button>
           <span id="plateColumnValue" class="plateNumberValue">8</span>
           <button
             class="plateSmallButton"
             onclick="changePlateColumnsUI(1)"
            >＋</button>
          </div>
          <!-- 縦 -->
          <div class="plateNumberRow">
           <span class="plateNumberLabel">縦（行）数</span>
           <button
             class="plateSmallButton"
             onclick="changePlateRowsUI(-1)"
            >−</button>
            <span id="plateRowValue" class="plateNumberValue">4</span>
           <button
             class="plateSmallButton"
             onclick="changePlateRowsUI(1)"
            >＋</button>
          </div>
          <button
           class="plateRefreshButton"
           onclick="refreshPlateUI()"
          >再表示</button>
        </div>
        <!-- 範囲操作 -->
        <div class="plateSection">
         <div class="plateSectionTitle">範囲操作</div>
         <div class="plateWideButtonRow">
           <button onclick="selectAllPlateUI()">すべて選択</button>
           <button onclick="clearAllPlateUI()">すべて解除</button>
          </div>
        </div>
        <!-- 列選択 -->
        <div class="plateSection">
         <div class="plateSectionTitle">一列選択</div>
         <div
           id="plateColumnButtons"
           class="plateIndexArea"
          ><!-- JavaScriptで1〜8を作成 --></div>
        </div>
        <!-- 行選択 -->
        <div class="plateSection">
         <div class="plateSectionTitle"> 一行選択</div>
         <div
           id="plateRowButtons"
           class="plateIndexArea"
          ><!-- JavaScriptで1〜4を作成 --></div>
        </div>
        <!-- 説明 -->
        <div class="plateHelp">
         <div>マス：クリックで選択・解除</div>
         <div>列番号：クリックで一列選択</div>
         <div>行番号：クリックで一行選択</div>
        </div>
      </div>
    </div>
    <!-- 選択時UI -->
    <div id="objectUI" style="display:none;">
      <button
        id="backButton"
        onclick="backToDefaultUI()"
      >←</button>
      <h3>オブジェクト設定</h3>
      <p id="objectType">種類:</p>
      <p id="objectPosition">位置:</p>
      <p id="selectedKeyframeText">
        選択中キーフレーム: なし
      </p>
      <label>色</label>
      <input
        type="color"
        id="colorPicker"
        value="#ffff00"
      >
      <hr>
      <label>電源</label>
      <button
        id="powerButton"
        onclick="toggleTapeLight()"
      >OFF</button>
      <hr>
      <!-- テープライト選択時のUI -->
      <div id="tapeLightUI" style="display:none;">
        <label>向き</label>
        <br>
        <button onclick="setTapeDirection('left')">← 左</button>
        <button onclick="setTapeDirection('front')">前</button>
        <button onclick="setTapeDirection('right')">右 →</button>
        <button onclick="setTapeDirection('back')">後</button>
        <br><br>
        <input
         type="range"
         id="rotationSlider"
         min="0"
         max="360"
         value="0"
         oninput="updateRotationSlider(this.value)"
        >
        <p id="rotationValue">0°</p>
      </div>
      <!-- ムービングライト選択時のUI -->
      <div id="movingLightUI" style="display:none;">
        <div class="movingControlRow">
          <!-- 横方向 -->
          <div class="movingControlBox">
            <label>向き</label>
            <br>
            <button onclick="setMovingDirection('left')">左</button>
            <button onclick="setMovingDirection('front')">前</button>
            <button onclick="setMovingDirection('right')">右</button>
            <button onclick="setMovingDirection('back')">後</button>
            <br><br>
            <input
             type="range"
             id="movingRotationSlider"
             min="0"
             max="360"
             value="0"
             oninput="updateMovingRotationSlider(this.value)"
            >
            <div class="angleInputBox">
              <input
               type="number"
               id="movingRotationValue"
               class="angleInput"
               min="0"
               max="360"
               value="0"
               oninput="updateMovingRotationNumber(this.value)"
              >
              <span>°</span>
            </div>
          </div>
          <!-- 縦方向 -->
          <div class="movingControlBox">
            <label>縦方向</label>
            <br>
            <!-- 左側の方向ボタン分の空白 -->
            <div class="directionButtonSpace"></div>
            <input
             type="range"
             id="movingTiltSlider"
             min="-90"
             max="90"
             value="-30"
             oninput="updateMovingTiltSlider(this.value)"
            >
            <div class="angleInputBox">
            <input
             type="number"
             id="movingTiltValue"
             class="angleInput"
             min="-90"
             max="90"
             value="-30"
             oninput="updateMovingTiltNumber(this.value)"
            >
            <span>°</span>
          </div>
        </div>
      </div>
    </div>
      <hr>
      <button onclick="deleteSelectedObject()">
        削除
      </button>
    </div>
  </div>
  <!-- ↑ #ui 終了 -->
</div>
<!-- ↑ #mainArea 終了 -->
<!-- タイムラインはmainAreaの外 -->
<div id="timeline">
  <div id="timelineControls">
    <button onclick="playTimeline()">▶</button>
    <button onclick="pauseTimeline()">⏸</button>
    <button onclick="stopTimeline()">■</button>
    <input
      type="range"
      id="timeSlider"
      min="0"
      max="60"
      step="0.1"
      value="0"
      oninput="updateTimelineTime(this.value)"
    >
    <span id="currentTime">0.0s</span>
    <label>長さ</label>
    <input
      type="text"
      id="durationInput"
      value="60"
      style="width:60px; height:26px;"
      onkeydown="
        if(event.key === 'Enter') {
          changeTimelineDuration(this.value)
        }
      "
      onblur="changeTimelineDuration(this.value)"
    >
    <span>s</span>
    <button
      id="loopButton"
      onclick="toggleLoop()"
    >ループOFF</button>
    <input
      type="file"
      id="audioFile"
      accept=".mp3"
    >
  </div>
  <div id="timelineRuler">
    <div id="rulerHeader"></div>
    <div id="playhead"></div>
  </div>
  <div id="keyframeArea">
    <div id="playheadLine"></div>
    <div id="trackLabels"></div>
    <div id="keyframeInner"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
function onWindowResize() {
  camera.aspect =(window.innerWidth-300)/(window.innerHeight-300);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth-300,window.innerHeight-300);
}

let scene,camera,renderer;
let currentTime=0;
let isPlaying=false;
let light,sphere;
let lightOn=true;
let objects=[];
let selectedObject=null;
let selectedKeyframe = null;
let draggingKeyframe = null;
let copiedKeyframeData = null;
let isEditingKeyframe = false;
let raycaster=new THREE.Raycaster();
let mouse=new THREE.Vector2();
let isDragging=false;
let movingLightCount = 0;
let tapeLightCount=0;
let isDraggingKeyframe = false;
let movedKeyframe = false;
let justDraggedKeyframe = false;
let controlMode = "object";
let lastHueSentKeyframe = null;
let cameraYaw = 0;
let cameraPitch = 0;
let cameraDistance = 8;
const TRACK_HEIGHT = 80;
const KEYFRAME_TOP_OFFSET = 34;
let timelineDuration = 60; // タイムライン長
let pixelsPerSecond = 50;  // 1秒=50px
let audio = new Audio();   // 音楽用
let isLoop = false;
let audioContext = null;
let audioBuffer = null;
let roomWidth = 8;   // 横
let roomDepth = 8;   // 縦
let roomHeight = 3;  // 高さ
const ROOM_SCALE = 2.5;
let roomObjects = [];
let planeMode = false; // プレーン選択モードかどうか
let wallBlocks = [];   // 表示するブロック
let selectedBlocks = []; // 選択されたブロック
let currentPlaneWall = "front"; // 今設定している壁


init();
createTimelineRuler();
updateTimelineHeight();
syncTimelineScroll();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  camera = new THREE.PerspectiveCamera(75,(window.innerWidth-300)/(window.innerHeight-300),0.1,1000);
  camera.position.set(3, 3, 5);
  camera.lookAt(0, 0, 0);
  renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth - 300, window.innerHeight-300);
  document.getElementById("scene").appendChild(renderer.domElement);
  // 環境光
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);
  createRoom();
  // ライト
  light = new THREE.PointLight(0xffffff, 1, 100);
  light.position.set(0, 2, 0);
  scene.add(light);
  // ライト見た目
  sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.2),
    new THREE.MeshBasicMaterial({ color: 0xffff00 })
  );
  sphere.position.copy(light.position);
  scene.add(sphere);
  // テスト箱
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color: 0xff0000 })
  );
  box.position.y = 0.5;
  scene.add(box);
  renderer.domElement.addEventListener("mousedown", onMouseDown);
  window.addEventListener("mousemove", onMouseMove);
  window.addEventListener("mouseup", onMouseUp);
  document
  .getElementById("colorPicker")
  .addEventListener("change", changeLightColor);
  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("resize",onWindowResize);
  window.addEventListener("wheel",onMouseWheel,{passive:false});
  document
  .getElementById("keyframeArea")
  .addEventListener("dblclick", addKeyframe);
  document
  .getElementById("audioFile")
  .addEventListener("change", handleAudioFile);
  document
  .getElementById("keyframeArea")
  .addEventListener("click", clearKeyframeSelection);
  function clearKeyframeSelection(event) {
    // ドラッグ直後のクリックは無視
    if (justDraggedKeyframe) {
      justDraggedKeyframe = false;
      return;
    }
    if (event.target.closest(".keyframe")) {return;}
    if (selectedKeyframe) {
      selectedKeyframe.classList.remove("selectedKeyframe");
      selectedKeyframe = null;
      resetSelectedObjectToDefaultState();
    }
    updateSelectedKeyframeUI();
  }
  document
  .getElementById("cameraModeButton")
  .addEventListener("click", () => {controlMode = "camera";
    document
      .getElementById("cameraModeButton")
      .classList.add("active");
    document
      .getElementById("objectModeButton")
      .classList.remove("active");
  });
  document
  .getElementById("objectModeButton")
  .addEventListener("click", () => {
    controlMode = "object";
    document
      .getElementById("objectModeButton")
      .classList.add("active");
    document
      .getElementById("cameraModeButton")
      .classList.remove("active");
  });
}

// 描画
function animate() {
  requestAnimationFrame(animate);
  // 再生中
  if (isPlaying) {
    if (audio.src) {
      currentTime = audio.currentTime;
    } else {
      currentTime += 0.016;
    }
    if (currentTime >= timelineDuration) {
      if (isLoop) {
        currentTime = 0;
        lastHueSentKeyframe = null;
        document.getElementById(
          "timelineRuler"
        ).scrollLeft = 0;
        document.getElementById(
          "keyframeArea"
        ).scrollLeft = 0;
      } else {
        currentTime = timelineDuration;
        isPlaying = false;
        turnOffAllLights();
      }
    }
  }
  // UI更新
  document.getElementById("timeSlider").value =currentTime;
  document.getElementById("currentTime").textContent =currentTime.toFixed(1) + "s";
  // タイムライン位置
  const timelineX = currentTime * 50;
  document.getElementById("playhead").style.left =(150 + timelineX) + "px";
  document.getElementById("playheadLine").style.left =(150 + timelineX) + "px";
  // 再生中だけ自動スクロール
  if (isPlaying) {
    const ruler =document.getElementById("timelineRuler");
    const keyframeArea =document.getElementById("keyframeArea");
    // 赤線中央基準
    const scrollPosition =timelineX - 200;
    // 最大スクロール量
    const maxScroll =keyframeArea.scrollWidth -keyframeArea.clientWidth;
    // 範囲制限
    const scrollX = Math.min(
      Math.max(0, scrollPosition),maxScroll
    );
    // 上下同期
    ruler.scrollLeft = scrollX;
    keyframeArea.scrollLeft = scrollX;
  }
  applyKeyframes();
  renderer.render(scene, camera);
}

function createRoom() {
  // 前の部屋を削除
  roomObjects.forEach(obj => {
    scene.remove(obj);
  });
  roomObjects = [];
  const visualWidth = roomWidth * ROOM_SCALE;
  const visualDepth = roomDepth * ROOM_SCALE;
  const visualHeight = roomHeight * ROOM_SCALE;
  const halfW = visualWidth / 2;
  const halfD = visualDepth / 2;
  // 床
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(visualWidth, visualDepth),
    new THREE.MeshStandardMaterial({
      color: 0x5b3a29,
      roughness: 0.9
    })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  roomObjects.push(floor);
  const upperWallMaterial =
    new THREE.MeshStandardMaterial({color: 0xf2eadf});
  const lowerWallMaterial =
    new THREE.MeshStandardMaterial({color: 0xc8b79f});
  const ceilingMaterial =
    new THREE.MeshStandardMaterial({color: 0xf5f5f0});
  // 後ろ壁
  const backWall = new THREE.Mesh(
    new THREE.PlaneGeometry(visualWidth, visualHeight),
    upperWallMaterial
  );
  backWall.position.set(0, visualHeight / 2, -halfD);
  backWall.userData.surface = "wall";
  backWall.userData.wallSide = "back";
  scene.add(backWall);
  roomObjects.push(backWall);
  // 前壁
  const frontWall = new THREE.Mesh(
    new THREE.PlaneGeometry(visualWidth, visualHeight),
    upperWallMaterial
  );
  frontWall.rotation.y = Math.PI;
  frontWall.position.set(0, visualHeight / 2, halfD);
  frontWall.userData.surface = "wall";
  frontWall.userData.wallSide = "front";
  scene.add(frontWall);
  roomObjects.push(frontWall);
  // 左壁
  const leftWall = new THREE.Mesh(
    new THREE.PlaneGeometry(visualDepth, visualHeight),
    upperWallMaterial
  );
  leftWall.rotation.y = Math.PI / 2;
  leftWall.position.set(-halfW, visualHeight / 2, 0);
  leftWall.userData.surface = "wall";
  leftWall.userData.wallSide = "left";
  scene.add(leftWall);
  roomObjects.push(leftWall);
  // 右壁
  const rightWall = new THREE.Mesh(
    new THREE.PlaneGeometry(visualDepth, visualHeight),
    upperWallMaterial
  );
  rightWall.rotation.y = -Math.PI / 2;
  rightWall.position.set(halfW, visualHeight / 2, 0);
  rightWall.userData.surface = "wall";
  rightWall.userData.wallSide = "right";
  scene.add(rightWall);
  roomObjects.push(rightWall);
  // 天井
  const ceiling = new THREE.Mesh(
    new THREE.PlaneGeometry(visualWidth, visualDepth),
    ceilingMaterial
  );
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = visualHeight;
  scene.add(ceiling);
  roomObjects.push(ceiling);
}

function createTimelineRuler() {
  const ruler = document.getElementById("timelineRuler");
  const keyframeInner = document.getElementById("keyframeInner");
  // 既存の秒数表示を消す
  ruler.querySelectorAll(".timeMark").forEach(mark => mark.remove());
  // 幅を計算
  const labelWidth = 150;
  const timelineWidth = timelineDuration * pixelsPerSecond;
  const totalWidth = labelWidth + timelineWidth;
  // keyframeInnerの幅も更新
  keyframeInner.style.width = timelineWidth + "px";
  // 0秒〜曲の長さまで目盛り作成
  for (let i = 0; i <= Math.ceil(timelineDuration); i++) {
    const mark = document.createElement("div");
    mark.className = "timeMark";
    mark.style.left = (labelWidth + i * pixelsPerSecond) + "px";
    mark.textContent = i + "s";
    ruler.appendChild(mark);
  }
  // スライダーの最大値も更新
  document.getElementById("timeSlider").max = timelineDuration;
}

function handleAudioFile(event) {
  event.target.blur();
  const file = event.target.files[0];
  if (!file) {
    timelineDuration = 60;
    audioBuffer = null;
    document.getElementById("durationInput").value = 60;
    createTimelineRuler();
    redrawTimelineTracks();
    return;
  }
  audio.src = URL.createObjectURL(file);
  audio.onloadedmetadata = function() {
    timelineDuration = audio.duration;
    document.getElementById("durationInput").value =
      Math.ceil(timelineDuration);
    document.getElementById("timeSlider").max =
      timelineDuration;
    if (currentTime > timelineDuration) {
      currentTime = 0;
    }
    createTimelineRuler();
    redrawTimelineTracks();
  };
  const reader = new FileReader();
  reader.onload = function(e) {
    const arrayBuffer = e.target.result;
    if (!audioContext) {
      audioContext = new AudioContext();
    }
    audioContext.decodeAudioData(
      arrayBuffer,
      function(buffer) {
        audioBuffer = buffer;
        redrawTimelineTracks();
      }
    );
  };
  reader.readAsArrayBuffer(file);
}

function drawWaveformToCanvas(canvas, buffer) {
  const ctx = canvas.getContext("2d");
  const width = canvas.width;
  const height = canvas.height;
  ctx.clearRect(0, 0, width, height);
  const data = buffer.getChannelData(0);
  const step = Math.ceil(data.length / width);
  const amp = height / 2;
  ctx.fillStyle = "rgba(120, 120, 255, 0.8)";
  for (let i = 0; i < width; i++) {
    let min = 1.0;
    let max = -1.0;
    for (let j = 0; j < step; j++) {
      const value = data[(i * step) + j];
      if (value < min) min = value;
      if (value > max) max = value;
    }
    ctx.fillRect(
      i,(1 + min) * amp,1,
      Math.max(1, (max - min) * amp)
    );
  }
}

function syncTimelineScroll() {
  const ruler = document.getElementById("timelineRuler");
  const keyframeArea =document.getElementById("keyframeArea");
  let syncingFromRuler = false;
  let syncingFromKeyframe = false;
  // 上 → 下
  ruler.addEventListener("scroll", () => {
    if (syncingFromKeyframe) return;
    syncingFromRuler = true;
    keyframeArea.scrollLeft = ruler.scrollLeft;
    fixTrackLabelsPosition();
    syncingFromRuler = false;
  });
  // 下 → 上
  keyframeArea.addEventListener("scroll", () => {
    fixTrackLabelsPosition();
    if (syncingFromRuler) return;
    syncingFromKeyframe = true;
    ruler.scrollLeft = keyframeArea.scrollLeft;
    syncingFromKeyframe = false;
  });
}

function redrawTimelineTracks() {
  // ラベルを全部消す

    .querySelectorAll(".trackLabel")
    .forEach(label => label.remove());

  document
    .querySelectorAll(".trackLine")
    .forEach(line => line.remove());
  // 波形を全部消す
  document
    .querySelectorAll(".waveformCanvas")
    .forEach(canvas => canvas.remove());

  objects.forEach((obj, index) => {

function addKeyframe(event) {

  const labelWidth = 150;
  const x =event.clientX-rect.left+keyframeArea.scrollLeft-labelWidth;
  // 秒数変換
  const time = x / 50;
  // キーフレーム作成
  const keyframe =document.createElement("div");
  keyframe.className ="keyframe";
  // 位置
  keyframe.style.left =x + "px";
  const trackIndex = objects.indexOf(selectedObject);
  keyframe.style.top = (trackIndex * TRACK_HEIGHT + KEYFRAME_TOP_OFFSET) + "px";
  // 情報保存
  keyframe.dataset.time =time;
  // 色保存
  keyframe.dataset.color =selectedObject.userData.lightColor;
  keyframe.dataset.isOn =selectedObject.userData.isOn;
  if (selectedObject.userData.type === "テープライト") {
    keyframe.dataset.rotation =selectedObject.rotation.y;
  }
  if (selectedObject.userData.type === "ムービングライト") {
    keyframe.dataset.rotation =selectedObject.userData.head.rotation.y;
    keyframe.dataset.tilt =selectedObject.userData.tiltHead.rotation.x;
  }
  keyframe.dataset.target =selectedObject.userData.name;
  // 表示
  keyframe.title =time.toFixed(1) + "s";
  document.getElementById("keyframeInner").appendChild(keyframe);
  keyframe.addEventListener("mousedown",
   function(event) {
     draggingKeyframe = keyframe;
     movedKeyframe = false;
     // 前回キーフレーム選択解除
     if (selectedKeyframe) {
       selectedKeyframe.classList.remove("selectedKeyframe");
      }
     // 新しくキーフレーム選択
     selectedKeyframe = keyframe;
     selectedKeyframe.classList.add("selectedKeyframe");
     // 対象ライトも選択する
     selectObjectFromKeyframe(keyframe);
     // UI更新
     updateSelectedKeyframeUI();
     event.stopPropagation();
    }
  );
  keyframe.addEventListener("click", function(event) {
    event.stopPropagation();
  });
  keyframe.style.background =selectedObject.userData.lightColor;
   // イベント伝播停止
  event.stopPropagation();
  // 前回選択解除
  document
   .querySelectorAll(".keyframe")
   .forEach(kf => {kf.classList.remove("selectedKeyframe");
  });
  // 選択
  selectedKeyframe = keyframe;
  // 黄色枠追加
  keyframe.classList.add("selectedKeyframe");
  updateSelectedKeyframeUI();
}

function turnOffAllLights() {
  objects.forEach(obj => {
    obj.userData.isOn = false;
    if (obj.userData.type === "テープライト") {
      obj.userData.lightSurface.material.color.set(0x555555);
      obj.userData.glow.visible = false;

function stopTimeline() {
  // 再生停止
  isPlaying = false;
  if (audio.src) {
    audio.pause();
    audio.currentTime = 0;

  // 時間を0へ
  currentTime = 0;
  // スライダー戻す

  document.getElementById("keyframeArea").scrollLeft = 0;
  // 実機Hueを消灯
  sendHuePower(false);
  // 実機DMXムービングライトを消灯

function addMovingLight(place = "floor", wallSide = null) {
  movingLightCount++;
  const movingLight = new THREE.Group();
  // 土台
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(1, 0.5, 1),
    new THREE.MeshStandardMaterial({ color: 0x222222 })
  );
  movingLight.add(base);
  movingLight.userData.base = base;
  // ヘッド全体
  const yokeGroup = new THREE.Group();
  // ヘッドグループ
  const headGroup = new THREE.Group();
  // 半球
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(
      0.4,
      32,
      32,
      0,
      Math.PI * 2,
      0,
      Math.PI / 2
    ),
    new THREE.MeshStandardMaterial({ color: 0x111111 })
  );
  dome.rotation.x = Math.PI;
  headGroup.add(dome);
  // フタ
  const cap = new THREE.Mesh(
    new THREE.CircleGeometry(0.4, 32),
    new THREE.MeshStandardMaterial({ color: 0x555555 })
  );
  cap.position.y = -0.001;
  cap.rotation.x = -Math.PI / 2;
  headGroup.add(cap);
  // 光の線
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.38,
      1.2,
      5,
      32
    ),
    new THREE.MeshBasicMaterial({
      color: 0xffff00,
      transparent: true,
      opacity: 0.4
    })
  );
  beam.geometry.translate(0, -2.5, 0);
  beam.position.y = -0.02;
  beam.position.z = 0;
  beam.rotation.z = Math.PI;
  beam.visible = false;
  headGroup.add(beam);
  // ヘッド位置
  headGroup.position.y = 0.8;
  // 初期角度
  headGroup.rotation.y = Math.PI / 4;
  headGroup.rotation.x = -Math.PI / 6;
  yokeGroup.add(headGroup);
  movingLight.add(yokeGroup);
  // 設置位置
  const visualWidth = roomWidth * ROOM_SCALE;
  const visualDepth = roomDepth * ROOM_SCALE;
  const visualHeight = roomHeight * ROOM_SCALE;
  const halfW = visualWidth / 2;
  const halfD = visualDepth / 2;
  // 床に設置
  if (place === "floor") {
    movingLight.position.set(
      Math.random() * (visualWidth - 2) - (halfW - 1),
      0,
      Math.random() * (visualDepth - 2) - (halfD - 1)
    );
  }
  // 天井に設置
  else if (place === "ceiling") {
    movingLight.position.set(
      Math.random() * (visualWidth - 2) - (halfW - 1),
      visualHeight,
      Math.random() * (visualDepth - 2) - (halfD - 1)
    );
    movingLight.rotation.z = Math.PI;
  }
  // 壁に設置
  else if (place === "wall") {
    if (wallSide === "front") {
      movingLight.position.set(
        Math.random() * (visualWidth - 2) - (halfW - 1),
        Math.random() * (visualHeight - 2) + 1,
        halfD
      );
      movingLight.rotation.x = -Math.PI / 2;
      movingLight.userData.wallSide = "front";
    }
    else if (wallSide === "left") {
      movingLight.position.set(
        -halfW,
        Math.random() * (visualHeight - 2) + 1,
        Math.random() * (visualDepth - 2) - (halfD - 1)
      );
      movingLight.rotation.set(0, Math.PI, Math.PI / 2);
      movingLight.userData.wallSide = "left";
    }
    else if (wallSide === "back") {
      movingLight.position.set(
        Math.random() * (visualWidth - 2) - (halfW - 1),
        Math.random() * (visualHeight - 2) + 1,
        -halfD
      );
      movingLight.rotation.x = Math.PI / 2;
      movingLight.userData.wallSide = "back";
    }
    else if (wallSide === "right") {
      movingLight.position.set(
        halfW,
        Math.random() * (visualHeight - 2) + 1,
        Math.random() * (visualDepth - 2) - (halfD - 1)
      );
      movingLight.rotation.set(0, Math.PI, -Math.PI / 2);
      movingLight.userData.wallSide = "right";
    }
  }
  // 保存
  movingLight.userData.head = yokeGroup;
  movingLight.userData.tiltHead = headGroup;
  movingLight.userData.cap = cap;
  movingLight.userData.beam = beam;
  movingLight.userData.type = "ムービングライト";
  movingLight.userData.mountType = place;
  movingLight.userData.name =
    "ムービングライト" + movingLightCount;
  movingLight.userData.isOn = false;
  movingLight.userData.lightColor = "#00ccff";
  scene.add(movingLight);
  objects.push(movingLight);
  addTrackLabel(
    movingLight.userData.name,
    objects.length - 1
  );
  updateTimelineHeight();
  redrawTimelineTracks();
}

function updateMovingTiltUI() {
  if (!selectedObject) return;
  if (selectedObject.userData.type !== "ムービングライト") return;
  const tiltHead = selectedObject.userData.tiltHead;
  const degree = THREE.MathUtils.radToDeg(tiltHead.rotation.x);
  document.getElementById("movingTiltSlider").value =
    degree;
  document.getElementById("movingTiltValue").value =
    Math.round(degree);
}

// テープライト（長方形）
function addTapeLight() {
  tapeLightCount++;
  // テープライト全体
  const tapeGroup = new THREE.Group();
  // 黒い本体
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.2, 0.2),
    new THREE.MeshStandardMaterial({color: 0x111111})
  );
  tapeGroup.add(body);
  tapeGroup.userData.body = body;
  // 発光面
  const lightSurface = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 0.18),
    new THREE.MeshBasicMaterial({color: 0x555555,side: THREE.DoubleSide})
  );
  lightSurface.position.z = 0.101;
  // 横向きへ回転
  lightSurface.rotation.x = 0;
  // 光の広がり
  const glow = new THREE.Mesh(
    new THREE.BoxGeometry(
      2,    // 長さ
      0.05, // 高さ
      0.4   // 光の広がり
    ),
    new THREE.MeshBasicMaterial({
      color: 0xff00ff,
      transparent: true,
      opacity: 0.25
    })
  );
  // 下方向へ
  glow.position.y = -0.12;
  // 発光面の少し外
  glow.position.z = 0.12;
  // 最初は非表示
  glow.visible = false;
  tapeGroup.add(glow);
  tapeGroup.add(lightSurface);
  // 位置
  tapeGroup.position.set(Math.random() * 4 - 2,0.5,Math.random() * 4 - 2);
  // 情報保存
  tapeGroup.userData.type = "テープライト";
  tapeGroup.userData.name =
    "テープライト" + tapeLightCount;
  // ON/OFF
  tapeGroup.userData.isOn = false;
  // 保存色
  tapeGroup.userData.lightColor = "#ff00ff";
  // 発光面保存
  tapeGroup.userData.lightSurface =lightSurface;
  tapeGroup.userData.glow = glow;
  // シーン追加
  scene.add(tapeGroup);
  objects.push(tapeGroup);
  addTrackLabel(tapeGroup.userData.name, objects.length - 1);
  redrawTimelineTracks();
}

// マウス操作
function onMouseDown(event) {
  event.preventDefault();
  mouse.x =(event.offsetX / renderer.domElement.clientWidth) * 2 - 1;
  mouse.y =-(event.offsetY / renderer.domElement.clientHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  // プレーン選択モード
  if (controlMode === "plane") {
    const hits = raycaster.intersectObjects(wallBlocks, true);
    if (hits.length > 0) {
      const block = hits[0].object;
      block.userData.selected =!block.userData.selected;
      // 選択
      if (block.userData.selected) {
        block.material.color.set(0x66cc66);
        block.material.opacity = 0.55;
        if (!selectedBlocks.includes(block)) {
          selectedBlocks.push(block);
        }
      }
      // 選択解除
      else {
        block.material.color.set(0xffffff);
        block.material.opacity = 0.18;
        selectedBlocks =selectedBlocks.filter(b => b !== block);
      }
    }
    // プレーンモードではライト選択処理に進ませない
    return;
  }
  // 通常のライト選択・移動モード
  isDragging = true;
  const intersects =raycaster.intersectObjects(objects, true);
  // 何もクリックしていない
  if (intersects.length === 0) {
    if (selectedObject) {
      removeOutline(selectedObject);
    }
    selectedObject = null;
    showDefaultUI();
    return;
  }
  // クリック対象取得
  const clickedObject = intersects[0].object;
  let newSelectedObject = clickedObject;
  // 一番上のGroupまでたどる
  while (
    newSelectedObject.parent &&
    newSelectedObject.parent !== scene
  ) {
    newSelectedObject = newSelectedObject.parent;
  }
  // 同じオブジェクトなら維持
  if (selectedObject === newSelectedObject) {
    return;
  }
  // 前回選択解除
  if (selectedObject) {
    removeOutline(selectedObject);
  }
  // 新しく選択
  selectedObject = newSelectedObject;
  // キーフレーム編集終了
  isEditingKeyframe = false;
  // キーフレーム選択解除
  if (selectedKeyframe) {
    selectedKeyframe.classList.remove("selectedKeyframe");
  }
  selectedKeyframe = null;
  updateSelectedKeyframeUI();
  showObjectUI(selectedObject);
  addOutline(selectedObject);
}

function onMouseUp() {
  isDragging = false;
  draggingKeyframe = null;
  if (movedKeyframe) {
    justDraggedKeyframe = true;
    movedKeyframe = false;
    setTimeout(() => {
      justDraggedKeyframe = false;
    }, 50);
  }
}

function onMouseWheel(event) {
  // 3D画面以外なら無視
  if (!renderer.domElement.contains(event.target)) {
    return;
  }
  event.preventDefault();
  // カメラが向いている方向を取得
  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);
  // ズーム速度 小さいほど滑らか
  const zoomSpeed = 0.03;
  // 逆になっていたのでマイナスを付ける
  const moveAmount = -event.deltaY * zoomSpeed;
  // カメラを向いている方向に前後移動
  camera.position.addScaledVector(direction, moveAmount);
  // 距離を保存
  cameraDistance = camera.position.distanceTo(
    new THREE.Vector3(0, 0, 0)
  );
}

function onMouseMove(event) {
  // キーフレームをドラッグ中
  if (draggingKeyframe) {
    const keyframeArea =document.getElementById("keyframeArea");
    const rect =keyframeArea.getBoundingClientRect();
    let x =event.clientX -rect.left -150 +keyframeArea.scrollLeft;
    if (x < 0) {
      x = 0;
    }
    if (x > 3000) {
      x = 3000;
    }
    const oldX =parseFloat(draggingKeyframe.style.left);
    if (Math.abs(x - oldX) > 3) {
      movedKeyframe = true;
    }
    draggingKeyframe.style.left =x + "px";
    const time =x / pixelsPerSecond;
    draggingKeyframe.dataset.time =time;
    draggingKeyframe.title =time.toFixed(1) + "s";
    updateSelectedKeyframeUI();
    return;
  }
  // マウスを押していなければ終了
  if (!isDragging) {
    return;
  }
  // カメラモード
  if (controlMode === "camera") {
    cameraYaw -=event.movementX * 0.005;
    cameraPitch -=event.movementY * 0.005;
    const limit =Math.PI / 2 - 0.1;
    cameraPitch = Math.max(
      -limit,
      Math.min(limit, cameraPitch)
    );
    camera.position.x =
      cameraDistance *Math.cos(cameraPitch) *Math.sin(cameraYaw);
    camera.position.y =
      cameraDistance *Math.sin(cameraPitch);
    camera.position.z =
      cameraDistance *Math.cos(cameraPitch) *Math.cos(cameraYaw);
    camera.lookAt(0, 0, 0);
    return;
  }
  // プレーン選択モード
  // プレーンモード中はライトを動かさない
  if (controlMode === "plane") {
    return;
  }
  // オブジェクトモード
  if (controlMode === "object") {
    if (!selectedObject) {
      return;
    }
    mouse.x =
      (event.offsetX /renderer.domElement.clientWidth) *2 -1;
    mouse.y =
      -(event.offsetY /renderer.domElement.clientHeight) *2 +1;
    raycaster.setFromCamera(
      mouse,camera
    );
    const point =new THREE.Vector3();
    let plane;
    const mountType =selectedObject.userData.mountType ||"floor";
    // 表示上の部屋サイズ
    const visualWidth =roomWidth * ROOM_SCALE;
    const visualDepth =roomDepth * ROOM_SCALE;
    const visualHeight =roomHeight * ROOM_SCALE;
    const halfW =visualWidth / 2;
    const halfD =visualDepth / 2;
    // 床に設置したライト
    if (mountType === "floor") {
      plane = new THREE.Plane(
        new THREE.Vector3(0, 1, 0),0
      );
      const hit =
        raycaster.ray.intersectPlane(plane,point);
      if (!hit) {
        return;
      }
      const x = Math.max(
        -halfW + 1,Math.min(halfW - 1,point.x)
      );
      const z = Math.max(
        -halfD + 1,Math.min(halfD - 1,point.z)
      );
      selectedObject.position.set(
        x,0,z
      );
    }
    // 天井に設置したライト
    else if (
      mountType === "ceiling"
    ) {
      plane = new THREE.Plane(
        new THREE.Vector3(0, 1, 0),-visualHeight
      );
      const hit =
        raycaster.ray.intersectPlane(plane,point);
      if (!hit) {
        return;
      }
      const x = Math.max(
        -halfW + 1,Math.min(halfW - 1,point.x)
      );
      const z = Math.max(
        -halfD + 1,Math.min(halfD - 1,point.z)
      );
      selectedObject.position.set(
        x,visualHeight,z
      );
    }
    // 壁に設置したライト
    else if (
      mountType === "wall"
    ) {
      const wallHits =
        raycaster
          .intersectObjects(roomObjects,true)
          .filter(
            hit =>hit.object.userData.surface === "wall"
          );
      if (wallHits.length === 0) {
        return;
      }
      const hit =wallHits[0];
      const side =hit.object.userData.wallSide;
      const p =hit.point.clone();
      // 壁の上下端に少し余白を残す
      p.y = Math.max(
        1,Math.min(visualHeight - 1,p.y)
      );
      // 前壁
      if (side === "front") {
        if (
          !isInsideSelectedBlock(p,"front")
        ) {
          return;
        }
        const x = Math.max(
          -halfW + 1,Math.min(halfW - 1,p.x)
        );
        selectedObject.position.set(
          x,p.y,halfD
        );
        selectedObject.rotation.set(
          -Math.PI / 2,0,0
        );
      }
      // 左壁
      else if (
        side === "left"
      ) {
        if (
          !isInsideSelectedBlock(p,"left")
        ) {
          return;
        }
        const z = Math.max(
          -halfD + 1,Math.min(halfD - 1,p.z
          )
        );
        selectedObject.position.set(
          -halfW,
          p.y,
          z
        );
        selectedObject.rotation.set(
          0,
          Math.PI,
          Math.PI / 2
        );
      }
      // 後壁
      else if (
        side === "back"
      ) {
        if (
          !isInsideSelectedBlock(
            p,
            "back"
          )
        ) {
          return;
        }
        const x = Math.max(
          -halfW + 1,
          Math.min(
            halfW - 1,
            p.x
          )
        );
        selectedObject.position.set(
          x,
          p.y,
          -halfD
        );
        selectedObject.rotation.set(
          Math.PI / 2,
          0,
          0
        );
      }
      // 右壁
      else if (
        side === "right"
      ) {
        if (
          !isInsideSelectedBlock(
            p,
            "right"
          )
        ) {
          return;
        }
        const z = Math.max(
          -halfD + 1,
          Math.min(
            halfD - 1,
            p.z
          )
        );
        selectedObject.position.set(
          halfW,
          p.y,
          z
        );
        selectedObject.rotation.set(
          0,
          Math.PI,
          -Math.PI / 2
        );
      }
      selectedObject.userData.wallSide =
        side;
    }
    updatePositionUI(
      selectedObject
    );
  }
}

function showWallBlocks() {
  // すでに表示されているブロックを削除
  clearWallBlocks();
  const visualWidth =roomWidth * ROOM_SCALE;
  const visualDepth =roomDepth * ROOM_SCALE;
  const visualHeight =roomHeight * ROOM_SCALE;
  const halfW =visualWidth / 2;
  const halfD =visualDepth / 2;
  // 分割数
  const cols = 8;
  const rows = 4;
  // 4つの壁
  const wallSides = [
    "front","back","left","right"
  ];
  wallSides.forEach(wallSide => {
    // 前後壁と左右壁では横幅が異なる
    let wallHorizontalSize;
    // 前壁・後壁は部屋の横幅を使う
    if (
      wallSide === "front" ||
      wallSide === "back"
    ) {
      wallHorizontalSize =visualWidth;
    }
    // 左壁・右壁は部屋の奥行きを使う
    else {
      wallHorizontalSize =visualDepth;
    }
    const blockWidth =wallHorizontalSize / cols;
    const blockHeight =visualHeight / rows;
    for (
      let row = 0;
      row < rows;row++
    ) {
      for (
        let col = 0;
        col < cols;
        col++
      ) {
        const block =
          new THREE.Mesh(
            new THREE.PlaneGeometry(
              blockWidth * 0.95,blockHeight * 0.95
            ),
            new THREE.MeshBasicMaterial({
              color: 0xcccccc,transparent: true,
              opacity: 0.25,side: THREE.DoubleSide,
              depthWrite: false
            })
          );
        // 壁面上の横位置
        const horizontalPosition =-wallHorizontalSize / 2 +
          blockWidth / 2 +col * blockWidth;
        // 壁面上の縦位置
        const y =blockHeight / 2 +row * blockHeight;
        // 前壁
        if (wallSide === "front") {
          block.position.set(
            horizontalPosition,
            y,halfD - 0.03
          );
          block.rotation.y =Math.PI;
        }
        // 後壁
        else if (
          wallSide === "back"
        ) {
          block.position.set(
            horizontalPosition,
            y,-halfD + 0.03
          );
          block.rotation.y = 0;
        }
        // 左壁
        else if (
          wallSide === "left"
        ) {
          block.position.set(
            -halfW + 0.03,
            y,horizontalPosition
          );
          block.rotation.y =Math.PI / 2;
        }
        // 右壁
        else if (
          wallSide === "right"
        ) {
          block.position.set(
            halfW - 0.03,
            y,horizontalPosition
          );
          block.rotation.y =-Math.PI / 2;
        }
        // ブロック情報
        block.userData.type ="wallBlock";
        block.userData.wallSide =wallSide;
        block.userData.col =col;
        block.userData.row =row;
        block.userData.blockWidth =blockWidth;
        block.userData.blockHeight =blockHeight;
        block.userData.selected =false;
        scene.add(block);
        wallBlocks.push(block);
      }
    }
  });
}

function clearWallBlocks() {
  wallBlocks.forEach(block => {
    scene.remove(block);
    block.geometry.dispose();
    block.material.dispose();
  });
  wallBlocks = [];
  // 削除済みブロックを選択配列に残さない
  selectedBlocks = [];
}

function showExistingWallBlocks() {
  wallBlocks.forEach(block => {
    block.visible = true;
  });
}

function hideWallBlocks() {
  wallBlocks.forEach(block => {
    block.visible = false;
  });
}

function isInsideSelectedBlock(
  point,
  wallSide
) {
  return selectedBlocks.some(
    block => {
      // 違う壁のブロックなら対象外
      if (
        block.userData.wallSide !==
        wallSide
      ) {
        return false;
      }
      const blockWidth =block.userData.blockWidth;
      const blockHeight =block.userData.blockHeight;
      const blockY =block.position.y;
      // 縦方向の判定
      const insideY =point.y >=blockY - blockHeight / 2 &&
        point.y <=blockY + blockHeight / 2;
      // 前壁・後壁
      // 横方向はx座標で判定
      if (
        wallSide === "front" ||
        wallSide === "back"
      ) {
        const blockX =block.position.x;
        const insideX =
          point.x >=blockX - blockWidth / 2 &&
          point.x <=blockX + blockWidth / 2;
        return insideX && insideY;
      }
      // 左壁・右壁
      // 横方向はz座標で判定
      if (
        wallSide === "left" ||
        wallSide === "right"
      ) {
        const blockZ =block.position.z;
        const insideZ =
          point.z >=blockZ - blockWidth / 2 &&
          point.z <=blockZ + blockWidth / 2;
        return insideZ && insideY;
      }
      return false;
    }
  );
}

// 位置更新
function updatePositionUI(obj) {
  document.getElementById("objectPosition").textContent =
    "位置: x=" + obj.position.x.toFixed(2) +
    ", z=" + obj.position.z.toFixed(2);
  // テープライト
  if (obj.userData.type === "テープライト") {
    document.getElementById("colorPicker").value =
      obj.userData.lightColor;
  }
  // ムービングライト
  else if (
    obj.userData.type === "ムービングライト"
  ) {
    document.getElementById("colorPicker").value =
      obj.userData.lightColor;
  }
}

function deleteSelectedObject() {
  if (!selectedObject) return;
  // 名前取得
  const name = selectedObject.userData.name;
  document.querySelectorAll(".keyframe").forEach(keyframe => {
    if (keyframe.dataset.target === name) {
      keyframe.remove();
    }
  });
  // ムービングライト番号取得
  if (selectedObject.userData.type ==="ムービングライト") {
    const match = name.match(/\d+/);
    if (match) {
      const deletedNumber =Number(match[0]);
      // 最後の番号なら戻す
      if (deletedNumber === movingLightCount) {
        movingLightCount--;
      }
    }
  }
  // テープライト番号取得
  if (selectedObject.userData.type ==="テープライト") {
    const match = name.match(/\d+/);
    if (match) {
      const deletedNumber =Number(match[0]);
      // 最後の番号なら戻す
      if (deletedNumber === tapeLightCount) {
        tapeLightCount--;
      }
    }
  }
  // シーンから削除
  scene.remove(selectedObject);
  // 配列から削除
  objects = objects.filter(obj => obj !== selectedObject);
  // 選択解除
  selectedObject = null;
  redrawTimelineTracks();
  // UI戻す
  showDefaultUI();
}

function changeLightColor(event) {
  const color = event.target.value;
  if (!selectedObject) return;
  // ●選択中ならキーフレームにも保存
  if (selectedKeyframe) {
    selectedKeyframe.dataset.color = color;
    selectedKeyframe.style.background = color;
  }
  // 3D側にも即反映
  selectedObject.userData.lightColor = color;
  if (selectedObject.userData.type === "テープライト") {
    if (selectedObject.userData.isOn) {
      selectedObject.userData.lightSurface.material.color.set(color);
      selectedObject.userData.glow.material.color.set(color);
      selectedObject.userData.glow.visible = true;
    } else {
      // OFF中は保存だけ
      selectedObject.userData.lightSurface.material.color.set(0x555555);
      selectedObject.userData.glow.visible = false;
    }
    sendHueColor(color);
  }
  else if (selectedObject.userData.type === "ムービングライト") {
    if (selectedObject.userData.isOn) {
      selectedObject.userData.cap.material.color.set(color);
      selectedObject.userData.beam.material.color.set(color);
      selectedObject.userData.beam.visible = true;
    } else {
      selectedObject.userData.cap.material.color.set(0x555555);
      selectedObject.userData.beam.visible = false;
    }
    const rgb = hexToRgb(color);
    sendColorToRealLight(rgb.r, rgb.g, rgb.b, 0, 100);
  }
}

function sendHueColor(color) {
  fetch("/hue/set_color", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      color: color
    })
  })
  .then(response => response.json())
  .then(data => {
    console.log("Hue色変更:", data);
  })
  .catch(error => {
    console.error("Hue送信エラー:", error);
  });
}

function sendHuePower(isOn) {
  fetch("/hue/set_power", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      on: isOn
    })
  })
  .then(response => response.json())
  .then(data => {
    console.log("Hue電源変更:", data);
  })
  .catch(error => {
    console.error("Hue電源送信エラー:", error);
  });
}

function toggleTapeLight() {
  if (!selectedObject) return;
  const powerButton = document.getElementById("powerButton");
  let newState;
  // ●選択中
  if (selectedKeyframe) {
    const current = selectedKeyframe.dataset.isOn === "true";
    newState = !current;
    selectedKeyframe.dataset.isOn = newState.toString();
  }
  // 通常ライト選択中
  else {
    newState = !selectedObject.userData.isOn;
    selectedObject.userData.isOn = newState;
  }
  selectedObject.userData.isOn = newState;
  powerButton.textContent = newState ? "ON" : "OFF";
  if (selectedObject.userData.type === "テープライト") {
    if (newState) {
      selectedObject.userData.lightSurface.material.color.set(
        selectedObject.userData.lightColor
      );
      selectedObject.userData.glow.material.color.set(
        selectedObject.userData.lightColor
      );
      selectedObject.userData.glow.visible = true;
      sendHuePower(true);
    } else {
      selectedObject.userData.lightSurface.material.color.set(0x555555);
      selectedObject.userData.glow.visible = false;
      sendHuePower(false);
    }
  }
  else if (selectedObject.userData.type === "ムービングライト") {
    if (newState) {
      selectedObject.userData.cap.material.color.set(
        selectedObject.userData.lightColor
      );
      selectedObject.userData.beam.material.color.set(
        selectedObject.userData.lightColor
      );
      selectedObject.userData.beam.visible = true;
      const rgb = hexToRgb(selectedObject.userData.lightColor);
      sendColorToRealLight(rgb.r, rgb.g, rgb.b, 0, 100);
    } else {
      selectedObject.userData.cap.material.color.set(0x555555);
      selectedObject.userData.beam.visible = false;
      sendColorToRealLight(0, 0, 0, 0, 0);
    }
  }
}

// ムービングライト方向固定
function setMovingDirection(direction) {
  let rotation = 0;
  switch(direction) {
    case "front":
      rotation = 0;
      break;
    case "left":
      rotation = THREE.MathUtils.degToRad(90);
      break;
    case "right":
      rotation = THREE.MathUtils.degToRad(270);
      break;
    case "back":
      rotation = THREE.MathUtils.degToRad(180);
      break;
  }
  if (!selectedObject) return;
  if (selectedObject.userData.type !== "ムービングライト") return;
  // 3D画面にも即反映
  selectedObject.userData.head.rotation.y = rotation;
  // キーフレーム選択中なら保存もする
  if (selectedKeyframe) {
    selectedKeyframe.dataset.rotation = rotation;
  }
  updateMovingRotationUI();
}

// スライダー回転
function updateMovingRotationSlider(value) {
  if (!selectedObject) return;
  if (selectedObject.userData.type !== "ムービングライト") return;
  const degree = Number(value);
  const rotation = THREE.MathUtils.degToRad(degree);
  selectedObject.userData.head.rotation.y = rotation;
  if (selectedKeyframe) {
    selectedKeyframe.dataset.rotation = rotation;
  }
  document.getElementById("movingRotationValue").value =
    Math.round(degree);
}

// UI同期
function updateMovingRotationUI() {
  if (!selectedObject) return;
  if (selectedObject.userData.type !== "ムービングライト") return;
  const head = selectedObject.userData.head;
  const degree = THREE.MathUtils.radToDeg(head.rotation.y);
  const fixedDegree = ((degree % 360) + 360) % 360;
  document.getElementById("movingRotationSlider").value =
    fixedDegree;
  document.getElementById("movingRotationValue").value =
    Math.round(fixedDegree);
}

// 向き固定ボタン
function setTapeDirection(direction) {
  let rotation = 0;
  switch(direction) {
    case "front":
      rotation = 0;
      break;
    case "left":
      rotation = THREE.MathUtils.degToRad(90);
      break;
    case "right":
      rotation = THREE.MathUtils.degToRad(270);
      break;
    case "back":
      rotation = THREE.MathUtils.degToRad(180);
      break;
  }
  // キーフレーム編集
  if (selectedKeyframe) {
    selectedKeyframe.dataset.rotation =rotation;
    const degree =THREE.MathUtils.radToDeg(rotation);
    document.getElementById("rotationSlider").value = degree;
    document.getElementById("rotationValue").value =Math.round(degree) + "°";
    return;
  }
  // ライト編集
  if (!selectedObject) return;
  if (
    selectedObject.userData.type !==
    "テープライト"
  ) return;
  selectedObject.rotation.y = rotation;
  updateRotationUI();
}

// スライダー回転
function updateRotationSlider(value) {
  if (selectedKeyframe) {
    selectedKeyframe.dataset.rotation =THREE.MathUtils.degToRad(value);
    document.getElementById("rotationValue").value =Math.round(value) + "°";
    return;
  }
  if (!selectedObject) return;
  if (
    selectedObject.userData.type !=="テープライト"
  ) return;
  // degree → radian
  selectedObject.rotation.y =THREE.MathUtils.degToRad(value);
  // 表示更新
  document.getElementById(
    "rotationValue"
  ).textContent =Math.round(value) + "°";
}

function selectObjectFromKeyframe(keyframe) {
  const targetName = keyframe.dataset.target;
  const targetObject = objects.find(obj =>
    obj.userData.name === targetName
  );
  if (!targetObject) return;
  // 前の黄色枠を消す
  if (selectedObject && selectedObject !== targetObject) {
    removeOutline(selectedObject);
  }
  // 選択中ライトを変更
  selectedObject = targetObject;
  // キーフレームの内容をライトに反映
  applyKeyframeStateToObject(keyframe, selectedObject);
  // UI更新
  showObjectUI(selectedObject);
  // 黄色枠追加
  addOutline(selectedObject);
}

function applyKeyframeStateToObject(keyframe, obj) {
  const color = keyframe.dataset.color;
  const isOn = keyframe.dataset.isOn === "true";
  const rotation = Number(keyframe.dataset.rotation);
  obj.userData.lightColor = color;
  obj.userData.isOn = isOn;
  // テープライト
  if (obj.userData.type === "テープライト") {
    obj.rotation.y = rotation;
    if (isOn) {
      obj.userData.lightSurface.material.color.set(color);
      obj.userData.glow.material.color.set(color);
      obj.userData.glow.visible = true;
    } else {
      obj.userData.lightSurface.material.color.set(0x555555);
      obj.userData.glow.visible = false;
    }
    updateRotationUI();
  }
  // ムービングライト
  else if (obj.userData.type === "ムービングライト") {
    obj.userData.head.rotation.y = rotation;
    if (keyframe.dataset.tilt !== undefined) {
      obj.userData.tiltHead.rotation.x =
        Number(keyframe.dataset.tilt);
    }
    if (isOn) {
      obj.userData.cap.material.color.set(color);
      obj.userData.beam.material.color.set(color);
      obj.userData.beam.visible = true;
    } else {
      obj.userData.cap.material.color.set(0x555555);
      obj.userData.beam.visible = false;
    }
    updateMovingRotationUI();
    updateMovingTiltUI();
  }
  document.getElementById("colorPicker").value = color;
  document.getElementById("powerButton").textContent =
    isOn ? "ON" : "OFF";
}

// 回転UI更新
function updateRotationUI() {
  if (!selectedObject) return;
  const degree =
    THREE.MathUtils.radToDeg(selectedObject.rotation.y);
  // 0〜360へ補正
  const fixedDegree =((degree % 360) + 360) % 360;
  // スライダー同期
  document.getElementById("rotationSlider").value = fixedDegree;
  // 数値表示
  document.getElementById(
    "rotationValue"
  ).textContent =Math.round(fixedDegree) + "°";
}

function updateRotationNumber(value) {
  if (value === "") return;
  let degree = Number(value);
  degree = Math.max(0, Math.min(360, degree));
  document.getElementById("rotationSlider").value = degree;
  updateRotationSlider(degree);
}

function updateMovingRotationNumber(value) {
  if (value === "") return;
  let degree = Number(value);
  degree = Math.max(0, Math.min(360, degree));
  document.getElementById("movingRotationSlider").value =
    degree;
  updateMovingRotationSlider(degree);
}

function updateMovingTiltNumber(value) {
  if (value === "") return;
  let degree = Number(value);
  degree = Math.max(-90, Math.min(90, degree));
  document.getElementById("movingTiltSlider").value =
    degree;
  updateMovingTiltSlider(degree);
}

function onKeyDown(event) {
  // 入力欄を操作しているときは邪魔しない
  if (
    event.target.tagName === "INPUT" ||
    event.target.tagName === "TEXTAREA"
  ) {
    return;
  }
  // Ctrl+C
  if (event.ctrlKey && event.key === "c") {
    if (!selectedKeyframe) return;
    copiedKeyframeData = {
      color: selectedKeyframe.dataset.color,
      isOn: selectedKeyframe.dataset.isOn,
      rotation: selectedKeyframe.dataset.rotation,
      tilt: selectedKeyframe.dataset.tilt,
      target: selectedKeyframe.dataset.target
    };
    return;
  }
  // Ctrl+V
  if (event.ctrlKey && event.key === "v") {
    if (!copiedKeyframeData) return;
    if (!selectedObject) return;
    createCopiedKeyframe();
    return;
  }
  // Backspaceキー
  if (event.key === "Backspace") {
    event.preventDefault();
    // キーフレーム選択中なら●削除
    if (selectedKeyframe) {
      selectedKeyframe.remove();
      selectedKeyframe = null;
      updateSelectedKeyframeUI();
      return;
    }
    // ライト選択中ならライト削除
    if (selectedObject) {
      deleteSelectedObject();
    }
  }
}

function addOutline(obj) {
  if (obj.userData.outline) return;
  let targetMesh = null;
  // ムービングライト
  if (obj.userData.type === "ムービングライト") {
    targetMesh = obj.userData.base;
  }
  // テープライト
  else if (obj.userData.type === "テープライト") {
    targetMesh = obj.userData.body;
  }
  // Meshじゃないなら終了
  if (!targetMesh) return;
  const edges = new THREE.EdgesGeometry(
    targetMesh.geometry
  );
  const line = new THREE.LineSegments(
    edges,
    new THREE.LineBasicMaterial({color: 0xffff00})
  );
  line.raycast = () => {};
  line.scale.set(1.05, 1.05, 1.05);
  targetMesh.add(line);
  obj.userData.outline = line;
}

function applyKeyframes() {
  // 全キーフレーム取得
  const keyframes = document.querySelectorAll(".keyframe");
  keyframes.forEach(keyframe => {
    // 保存時間
    const keyTime = Number(keyframe.dataset.time);
    // 保存色
    const color = keyframe.dataset.color;
    const isOn =keyframe.dataset.isOn === "true";
    const rotation =Number(keyframe.dataset.rotation);
    // 保存対象ライト名
    const targetName = keyframe.dataset.target;
    // 時間一致
    if (Math.abs(currentTime - keyTime) < 0.1) {
      objects.forEach(obj => {
        // 対象ライトだけ実行
        if (obj.userData.name !== targetName) return;
        // テープライト
        if (obj.userData.type === "テープライト") {
          // 向き適用
          obj.rotation.y = rotation;
          // ON/OFF適用
          obj.userData.isOn = isOn;
          if (isOn) {
            obj.userData.lightSurface.material.color.set(color);
            obj.userData.glow.material.color.set(color);
            obj.userData.glow.visible = true;
            const keyId =targetName + "_" +keyTime.toFixed(1);
            if (lastHueSentKeyframe !== keyId) {
              sendHueColor(color);
              lastHueSentKeyframe = keyId;
            }
          }
          else {
            obj.userData.lightSurface.material.color.set(0x555555);
            obj.userData.glow.visible = false;
            const keyId =targetName + "_" +keyTime.toFixed(1);
            if (lastHueSentKeyframe !== keyId) {
              sendHuePower(false);
              lastHueSentKeyframe = keyId;
            }
          }
        }
        // ムービングライト
        if (obj.userData.type === "ムービングライト") {
          obj.userData.head.rotation.y = rotation;
          if (keyframe.dataset.tilt !== undefined) {
            obj.userData.tiltHead.rotation.x =
             Number(keyframe.dataset.tilt);
          }
          // ON/OFF適用
          obj.userData.isOn = isOn;
          obj.userData.lightColor = color;
          if (isOn) {
            obj.userData.cap.material.color.set(color);
            obj.userData.beam.material.color.set(color);
            obj.userData.beam.visible = true;
          }
          else {
            obj.userData.cap.material.color.set(0x555555);
            obj.userData.beam.visible = false;
          }
          const keyId =targetName + "_" +keyTime.toFixed(1) + "_" +color + "_" +isOn;
          if (lastHueSentKeyframe !== keyId) {
            sendMovingLightToRealLight(color, isOn);
            lastHueSentKeyframe = keyId;
          }
        }
      });
    }
  });
}

function updateSelectedKeyframeUI() {
  // 選択なし
  if (!selectedKeyframe) {
    document.getElementById("selectedKeyframeText").textContent =
      "選択中キーフレーム: なし";
    return;
  }
  // 時間取得
  const time = Number(selectedKeyframe.dataset.time);
  document.getElementById("selectedKeyframeText").textContent =
    "選択中キーフレーム: " + time.toFixed(1) + "秒";
  // 色
  document.getElementById("colorPicker").value =
    selectedKeyframe.dataset.color;
  // 電源
  document.getElementById("powerButton").textContent =
    selectedKeyframe.dataset.isOn === "true" ? "ON" : "OFF";
  // テープライト
  if (
    selectedObject &&
    selectedObject.userData.type === "テープライト"
  ) {
    const degree =
      THREE.MathUtils.radToDeg(
        Number(selectedKeyframe.dataset.rotation)
      );
    document.getElementById("rotationSlider").value = degree;
    document.getElementById("rotationValue").textContent =
      Math.round(degree) + "°";
  }
  // ムービングライト
  if (
    selectedObject &&
    selectedObject.userData.type === "ムービングライト"
  ) {
    const degree =
      THREE.MathUtils.radToDeg(
        Number(selectedKeyframe.dataset.rotation)
      );
    document.getElementById("movingRotationSlider").value = degree;
    // number入力なので「°」は付けない
    document.getElementById("movingRotationValue").value =
      Math.round(degree);
    // 縦方向
    if (selectedKeyframe.dataset.tilt !== undefined) {
      const tiltDegree =
        THREE.MathUtils.radToDeg(
          Number(selectedKeyframe.dataset.tilt)
        );
      document.getElementById("movingTiltSlider").value =
        tiltDegree;
      document.getElementById("movingTiltValue").value =
        Math.round(tiltDegree);
    }
  }
}

function removeOutline(obj) {
  if (!obj.userData.outline) return;
  obj.userData.outline.parent.remove(obj.userData.outline);
  obj.userData.outline.geometry.dispose();
  obj.userData.outline.material.dispose();
  obj.userData.outline = null;
}

function sendColorToRealLight(r, g, b, w = 0, master = 100) {
  fetch("http://127.0.0.1:5000/dmx/set_color", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      r: r,
      g: g,
      b: b,
      w: w,
      master: master
    })
  })
  .then(response => response.json())
  .then(data => {
    console.log("実機ライトへ送信成功:", data);
  })
  .catch(error => {
    console.error("実機ライト送信エラー:", error);
  });
}

function hexToRgb(hex) {
  hex = hex.replace("#", "");
  return {
    r: parseInt(hex.substring(0,2),16),
    g: parseInt(hex.substring(2,4),16),
    b: parseInt(hex.substring(4,6),16)
  };
}

function sendMovingLightToRealLight(color, isOn) {
  if (isOn) {
    const rgb = hexToRgb(color);
    sendColorToRealLight(rgb.r, rgb.g, rgb.b, 0, 100);
  } else {
    sendColorToRealLight(0, 0, 0, 0, 0);
  }
}

function resetSelectedObjectToDefaultState() {
  if (!selectedObject) return;
  selectedObject.userData.isOn = false;
  if (selectedObject.userData.type === "テープライト") {
    selectedObject.userData.lightSurface.material.color.set(0x555555);
    selectedObject.userData.glow.visible = false;
  }
  if (selectedObject.userData.type === "ムービングライト") {
    selectedObject.userData.cap.material.color.set(0x555555);
    selectedObject.userData.beam.visible = false;
    selectedObject.userData.head.rotation.y = 0;
    selectedObject.userData.tiltHead.rotation.x = -Math.PI / 6;
  }
  updateSelectedKeyframeUI();
  if (selectedObject.userData.type === "ムービングライト") {
    updateMovingRotationUI();
    updateMovingTiltUI();
  }
  if (selectedObject.userData.type === "テープライト") {
    updateRotationUI();
  }
}
